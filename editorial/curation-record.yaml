date: '2026-10-12'
purpose: Bilingual learner presentation; concise editorial decisions only, no private model reasoning.
archived_entry_ids:
- gap-latency-budget-worksheet
- gap-checkpoint-provenance
- gap-onnx-export
- gap-network-stall
- gap-export-ros-coverage
- keon-awesome-physical-ai
- dead-fkromer-awesome-ros2
- dead-awesome-il
- dead-rfm-how-to
- nonexistent-resources
- seo-contamination
- pricing-provenance
entry_notes:
  flashrt-benchmark-table:
    why: 'Resolves the question the feasibility arithmetic in docs/41-real-time-inference.md depends on:
      is the model fast enough for your control rate on the hardware you own. The ordering of magnitude
      — 714 ms down to 51 ms for the same model class — is the single most useful fact in this section,
      because it says the answer is mostly about the inference stack, not the model.

      '
    notes: 'FlashRT''s README warns against comparing its RTX 4090 numbers with RTX 5090 or TensorRT rows.
      Heed that: the table is a map of what has been reported, not a controlled comparison.

      '
  flashrt:
    why: 'Small batch is exactly the VLA regime that large-batch-optimised serving stacks underserve —
      you infer for one robot, not a request queue. If your latency numbers look like the 714 ms row rather
      than the 51 ms row, the difference is the inference stack.

      '
  nvidia-forum-thor-rtx:
    why: 'The best single primary source of real π0.5 and GR00T latency on shipping hardware. It also
      gives you the number that decides a robot''s architecture: 23 Hz on Thor means a 50 Hz control loop
      cannot be fed synchronously from the policy, so you need chunking or async execution regardless
      of anything else.

      '
  groot-optimization-docs:
    why: 'Answers "what does torch.compile and TensorRT actually buy me, on which GPU" for a named model,
      from the vendor. Two things stand out: the compile win is large on GPUs and small on Thor (117 to
      105 ms), and on Orin no stack gets you under 173 ms — which rules out synchronous 20 Hz control
      on that part and tells you the hardware is the constraint before you start optimising code.

      '
  embodied-efficiency:
    why: 'The most valuable single result in this file. The default assumption — that low-bit quantisation
      buys latency — is wrong for a VLA sampler at batch 1, where it is a *memory footprint* lever only.
      Teams that skip this experiment spend weeks quantising, break their policy''s action fidelity, and
      get slower inference. Read it before writing any quantisation code.

      '
    notes: 'The 0.089 ms/action figure is the honest statement of what open-loop chunk execution buys:
      it is not that inference got cheaper, it is that you stopped paying for it per step and accepted
      staleness instead. See docs/41-real-time-inference.md.

      '
  jetson-pi:
    why: 'The concrete answer to the most common hardware complaint in this space — "the policy runs at
      5 Hz and the arm wants 50 Hz". Rather than waiting for a faster model, it decouples inference rate
      from control rate, which is the same conclusion RTC reaches from the algorithmic side.

      '
  xpu-characterization:
    why: 'The best hardware-heterogeneity study available: it tells you which stage dominates on which
      part, so you optimise the thing that is actually slow on your device instead of the thing that was
      slow on the authors'' device. Stage breakdowns are also what you need to decide between caching,
      pruning, and a smaller encoder.

      '
  foldquantvla:
    why: 'Complements the negative result above: if naive LLM quantisation fails on a VLA, this is the
      attempt to identify why and fix it, rather than concluding quantisation is useless for policies.

      '
  open-loop-revisited:
    why: 'The counterweight to "always re-plan as fast as possible". Directly relevant when your asynchronous
      loop performs *worse* than plain open-loop chunk execution — which happens, and which the reactivity
      narrative does not predict.

      '
  ros2-wireless:
    why: 'The clearest published data on ROS 2-over-WiFi failure modes, and the explanation for the most
      confusing class of deployment bug: everything is smooth on Ethernet and drops frames on WiFi.

      '
  gap-latency-budget-worksheet:
    why: 'Both RTC''s `inference_delay` and LeRobot''s chunk thresholds *require* a per-step delay estimate,
      and both sets of docs tell you to compute it without telling you how. A measured example on one
      popular stack (pi0.5, three cameras, SO-101 or UR5e) would immediately become the reference this
      field lacks. Partial ingredients exist: Jetson-PI''s per-module table, FlashRT''s separated harness
      numbers, and the framework above.

      '
    notes: 'We deliberately narrowed this from "nobody publishes the framework" to "nobody publishes filled-in
      numbers", after finding the framework. An over-broad gap claim damages a curated index as much as
      a dead link does.

      '
  gap-checkpoint-provenance:
    why: 'The most consequential missing piece for reproducibility, and calibration drift is documented
      and real. Without it, "the model that worked last month" is unfalsifiable. `templates/deployment-manifest.yaml`
      in this repo is a starting point, not a solution.

      '
  gap-onnx-export:
    why: 'What is missing is not just the export but the **action-parity harness**: after exporting, compare
      action chunks against the reference implementation on a fixed batch of observations, and report
      max absolute deviation. Without that check, an export that silently degrades the policy looks like
      a policy regression.

      '
  gap-network-stall:
    why: 'This is a safety question disguised as a networking question. The answer should be a defined
      behaviour — decelerate to a stop along a safe path — and right now it is usually whatever the framework
      happens to do, which is frequently "keep executing the stale chunk". Papers tell you the problem
      is real; nobody tells you what their robot did.

      '
    notes: 'We deliberately rewrote this after finding the academic work. The original claim that the
      problem was undocumented was too broad, and an over-broad gap claim damages a curated index as much
      as a dead link does.

      '
  gap-export-ros-coverage:
    why: 'This is the single most consequential gap for anyone choosing a framework, and it is invisible
      until too late: you can pick a training framework, spend a week fine-tuning, and only then discover
      there is no supported way to hit your control rate. The framework comparison tables that exist rank
      models by success rate on benchmarks, not by whether the output can be deployed at all. Practical
      consequence: **decide your control-rate requirement first, then check the framework''s export story
      before you commit**, not after. And read the published latency rather than assuming a faster GPU
      closes the gap — see [docs/41](docs/41-real-time-inference.md) for the arithmetic.

      '
  language-grounding-gap:
    why: 'Add paired rollouts with the same scene and different visible targets to deployment acceptance
      tests; nominal success on scene-correlated instructions misses this failure.

      '
    notes: 'October 2026 preprint reports simulated and real-world experiments. The finding is scoped
      to the tested policies and protocol; implementation and independent reproduction were not verified
      here. Exact title checked against arXiv API on 2026-10-08.

      '
  oft-hardware-drift:
    why: 'The strongest evidence anywhere that a VLA deployment can silently rot. It is the reason `templates/deployment-manifest.yaml`
      exists: without binding a checkpoint to the camera pose, the calibration hash and the joint condition
      it was validated against, "the model that worked last month" is an unfalsifiable claim and you will
      spend that month retraining. Physical wear is a distribution shift, and it is not in any dataset.

      '
  picknik-loss-curve:
    why: 'States plainly the thing that wastes the most time in this field: reading the loss as if it
      were a success rate. It is also the cleanest argument for instrumenting rollouts from the first
      day rather than after the loss looks good.

      '
  oft-more-data-did-not-fix-it:
    why: 'Direct counter-evidence to the reflex answer of "collect more episodes". More data in the same
      distribution does not fix a conditioning failure — if the instruction is not being used, more examples
      of it not being used does not help. Diagnose which failure you have before spending weeks on collection.

      '
  lerobot-25-episodes-failed:
    why: 'A rare published number where a *specific* demonstration count is documented as failing, rather
      than a vague recommendation to collect more. Combined with the maintainer guidance below, it gives
      you a defensible floor instead of a guess.

      '
  lerobot-50-is-a-floor:
    why: 'Converts the collection question from "more is better" into a number you can plan against, and
      makes the key variable explicit: it is not the episode count, it is the number of distinct *conditions*
      you need to cover. Ten episodes per location is a much more useful planning rule than a total.

      '
  pi0-authors-hedge:
    why: 'Worth citing when a fine-tune fails and the instinct is to blame your own data pipeline. The
      model authors state that transfer to a different platform is not guaranteed. It also justifies budgeting
      for a port as a research task rather than an engineering one.

      '
  oft-copies-bad-demos:
    why: 'Imitation learning reproduces the data, including its mistakes. A behaviour that appears in
      a consistent fraction of rollouts is usually in your demonstrations, not in the model. This is the
      argument for watching your own teleoperation footage before assuming an optimisation problem.

      '
  sim-benchmarks-hid-the-problem:
    why: 'Peer-reviewed support for treating simulation results as a screening filter rather than evidence
      of deployment readiness — and a concrete list of the unglamorous fixes that real deployment actually
      needed.

      '
  openvla-100-demos:
    why: 'Gives an alternative to watching the loss: action-token accuracy on your own data is a concrete,
      checkable target with a stated value, and it is a much better early signal than the training loss.

      '
  smolvla-pretraining-payoff:
    why: 'Quantifies what you get from starting at a pretrained checkpoint rather than from scratch, which
      is the main argument for the fine-tuning approach this repo assumes. It also sets a realistic expectation
      for how far a small open model can go when the pretraining mixture matches your hardware.

      '
  position-beats-velocity:
    why: 'Direct counter-evidence for anyone planning a velocity or torque action space, and it interacts
      with two other entries in this repo. DROID ships joint **velocity** actions at 15 Hz, so copying
      its convention is not automatically wrong — but this result says the choice has a latency cost,
      and latency is the thing [docs/41](docs/41-real-time-inference.md) is about. A velocity action space
      makes your policy more sensitive to exactly the staleness that chunked inference already introduces.
      Useful as the counterweight when someone proposes velocity actions for smoothness: the evidence
      points the other way.

      '
  lerobot-docs:
    why: The single most practical starting point in the field, and the reference implementation for the
      LeRobot dataset format everything else converts to or from.
  lerobot-il-robots:
    why: Contains the operational detail (calibration procedure, teleoperation setup) that papers omit
      and that eats your first week.
  lerobot-so101:
    why: A worked example of the calibration discipline every learned policy depends on. The procedure
      generalises even if your arm is different.
  aloha:
    why: The reference architecture for bimanual data collection. Cheap, replicable, and the hardware
      design has been reimplemented by many labs.
  umi:
    why: Decouples data volume from robot availability — the main practical bottleneck in collection.
      Its in-the-wild capture also gives the visual diversity that fixes overfitting to one table setup.
  open-television:
    why: Faster and more natural collection than leader-follower arms, and it records head/vision motion
      which is otherwise impossible to demonstrate.
  robot-teach:
    why: Interesting for data efficiency — worth knowing when the question is 'how few demonstrations
      can I get away with', which is most people's real constraint.
  robomimic:
    why: The most rigorous public evidence on which data-quality factors actually move success rate. Read
      it before assuming more data is the answer — number of demonstrations, operator quality and diversity
      often matter more than volume.
  robosuite:
    why: Useful for pre-flight checks and for generating targeted recovery data before spending robot
      time.
  mimicgen:
    why: The most credible way to multiply scarce human demonstrations. Note the caveat that generated
      data inherits the failure modes of the source trajectories — it will not fix bad teleoperation.
  open-x-embodiment:
    why: The standard co-training corpus. Mostly useful as regularisation against overfitting a small
      in-house dataset, not as a task-specific training set.
  open-x-embodiment-repo:
    why: The practical entry point — the project page alone will not get the data into your training loop.
  data-curation-paper:
    why: Gives you a defensible answer to 'should I throw away these episodes' instead of guessing.
  curating-online-experience:
    why: Data selection driven by what the policy actually gets wrong, which is usually a much better
      signal than any offline heuristics.
  subgoal-transitions:
    why: Directly addresses the failure where a chained policy executes the first sub-task and then stalls
      — which is the single most reported symptom in this space.
  rac-recovery:
    why: 'The clearest statement of the thing practitioners learn the hard way: long-horizon failures
      are usually covariate shift, and the fix is recovery data — not more demonstrations of the happy
      path.'
  action-only-scorers-fail:
    why: 'The academic confirmation of the argument this repo makes about dataset balance: **do not curate
      or reweight by action value.** If your quality signal is computed from the action distribution,
      it is provably blind to the defects that matter. Pair an action-based scorer with a structural one,
      or you will filter out good episodes and keep bad ones — and the metrics will look like they are
      working the whole time.

      '
  balanced-bc-imbalanced:
    why: 'The right level at which to think about balance. Imbalance matters at the behaviour/skill/sub-task
      level, not the action-value level, and this quantifies how much an over-represented behaviour distorts
      the policy. Read it before deciding your dataset is imbalanced and reaching for resampling.

      '
  openvla-mixture-recipe:
    why: 'The most concrete published account of how to build a VLA training mixture. Note what it balances
      — platform, task, scene — and what it does not: the marginal action histogram. That is the answer
      to "how do I make my data distribution even", from the people who trained one of the most widely
      used open VLAs.

      '
  agibot-world-pipeline:
    why: 'Two findings worth more than the dataset. First, **the excessive-idle-time defect was discovered
      by deploying a trained policy, not by inspecting the data** — industrial-scale confirmation that
      idle frames are a real failure cause and that auditing a dataset without a policy in the loop does
      not reliably find them. Second, it is a worked example of the deploy-find-defect-fix-collect flywheel,
      which is the operational shape every serious data effort eventually takes.

      '
  eventual-dead-frames:
    why: 'A concrete, reproducible idleness pass at real scale. Useful as a design reference when your
      dataset is too large to inspect episode by episode, which is the situation where nobody bothers
      to trim at all.

      '
  daft-motion-trimming:
    why: Copy-paste starting point for building your own dead-frame trimming pass rather than writing
      the plumbing from scratch.
  lerobot-doctor:
    why: 'Overlaps deliberately with our own `scripts/diag_dataset.py` — and you should know that, because
      choosing between them is better than running neither. This one is a packaged quality report; ours
      adds the phase-aliasing test, the chunk-target validity check and the action-convention probe, which
      are the diagnostics specific to the chained-task failure this repo is organised around. Use both
      if you like; they answer different questions.

      '
  lerobot-language-schema:
    why: '**Read this before inventing your own annotation schema.** It is the only annotation schema
      that ships inside a real dataset format, and it separates persistent from event language — the distinction
      homegrown schemas get wrong, because a sub-task label is state that persists across frames while
      an interjection is a moment. It is also the concrete answer to the phase-aliasing fix: this is how
      a per-frame sub-task label actually reaches a pi0.5 action expert, and it means the hierarchical
      path is available if you are on LeRobot. Note the codebase split — openpi contains no subtask branch
      at all, so on openpi the route is the instruction string.

      '
  lerobot-annotation-pipeline:
    why: 'The only end-to-end VLM auto-labelling pipeline from a major organisation, and the contact-sheet
      trick is the part worth stealing even if you build your own: segmenting a time-annotated strip of
      frames is a far easier VLM task than segmenting video, and it makes the model''s boundary decision
      auditable by a human afterwards.

      '
  lerobot-annotation-ui:
    why: 'The human correction pass on top of automatic labels. Worth having because automatic sub-task
      boundaries are good enough to seed and not good enough to trust — and a boundary error inside a
      chained task is exactly the kind of label noise that teaches a policy the wrong phase.

      '
  lerobot-good-dataset:
    why: 'Use it as your collection spec rather than writing one. The "only the follower and the objects
      move, leader arm out of frame" rule is the one most often broken, and it matters because a leader
      arm in view is a second, correlated copy of the action — the policy will happily learn to read it.

      '
  hd-space:
    why: 'The direct answer to "all my demonstrations start from the same initial state", which is the
      data-side cause of a policy that only ever performs the first motion. It gets you intermediate-state
      initialisation without hand-resetting the scene between every episode — the practical obstacle that
      stops teams from collecting this data at all.

      '
  robomimic-what-matters:
    why: 'The empirical backing for the two habits this repo keeps recommending: prefer clean demonstrations
      over volume, and never select a checkpoint by validation loss. Both are quantified here rather than
      asserted.

      '
  data-scaling-laws:
    why: 'The most decision-relevant paper for spending a data budget: collect breadth, not depth. If
      you are choosing between more demonstrations in the same scene and fewer demonstrations across more
      scenes, this is the evidence that the second is worth more. It is also the counterweight to the
      reflex of extending an existing session.

      '
  eapn-execution-aligned-replanning:
    why: 'A concrete research approach when an asynchronous queue removes pauses but the generated chunks
      still switch modes; evaluate continuity under measured inference delays.

      '
    notes: 'October 2026 preprint with simulation and real-robot experiments. Paper identity checked via
      arXiv API on 2026-10-08; runnable implementation and hardware performance were not independently
      verified here.

      '
  rephrase-before-you-act:
    why: 'Adds an explicit instruction interface to deployment: test paraphrase sensitivity before attributing
      a rollout regression to camera calibration or model quality.

      '
    notes: 'Reported gains are specific to the tested policies and tasks. The official project links code
      and rule artifacts, but end-to-end reproduction was not run here and a reuse license was not verified.
      Check rewritten intent as well as task success.

      '
  ogam-runtime-monitor:
    why: 'Offers a monitor design to study when policy attention is accessible; evaluate missed failures,
      false stops, and time-to-stop alongside task success before integration.

      '
    notes: 'Research evidence under the paper''s test protocol, not a general safety guarantee. Requires
      object masks, policy attention access, and successful calibration episodes; public implementation
      and independent hardware reproduction were not verified here.

      '
  lerobot-rtc-modes:
    why: 'Prevents treating trained RTC as a runtime switch for an arbitrary checkpoint. Both `execution_horizon`
      and `inference.queue_threshold` must be at least the checkpoint''s maximum training delay; the horizon
      must also be no greater than `chunk_size - rtc_training_max_delay`.

      '
    notes: 'Source inspected 2026-10-05. The main-branch guide includes trained mode while the published
      en/rtc page inspected on the same date still describes guided RTC only. Pin your LeRobot commit
      and use matching docs; no hardware validation was performed for this entry. Async scheduling alone
      does not enforce continuity between chunks.

      '
  lerobot-inference:
    why: 'Read this before designing your own inference loop — it already solves the common cases. What
      it does not cover is the rest of deployment: a keyword scan of the repo''s inference and policy
      docs returns 0 hits for TensorRT, ONNX, quantization, Jetson, and safety/e-stop/watchdog. That gap
      is what the sections below fill.

      '
  rtc:
    why: 'The core reference for the single most common real-robot timing problem. If your policy makes
      smooth predictions in open loop but stutters on hardware, the cause is usually that inference latency
      exceeds the chunk''s execution time and you are re-planning from a stale observation.

      '
  vla-rail:
    why: A concrete design for the inference/control decoupling problem, including how to keep the control
      loop fed while a chunk is in flight.
  world-action-models-real-time:
    why: An empirical rather than theoretical treatment — useful when you need to justify an architecture
      choice rather than a trick.
  holobrain-0:
    why: 'A clean statement of the failure mode: with synchronous inference you either block the control
      loop or act on stale observations, and both show up as degraded task success rather than as an obvious
      bug.'
  vla-cpp:
    why: Relevant if you are considering writing your own serving layer — check whether this already covers
      your model family before doing so.
  eva-client:
    why: Directly targets the integration cost that dominates real projects. Its evaluation harness is
      as interesting as its deployment path, because most labs evaluate ad hoc.
  eva-client-paper:
    why: Explains the design rationale behind the framework above.
  robot-control-stack:
    why: A pragmatic option when ROS2 is more integration overhead than you need for a single-arm manipulation
      setup. Compare against a ROS2 path before committing either way.
  minivla:
    why: One of the few projects that treats edge export as a first-class goal rather than an afterthought.
  embodirun:
    why: Early-stage, but worth tracking as the runtime layer of this stack matures.
  factory-floor-case-study:
    why: 'Rare and valuable: most deployment literature reports successes on lab benches. A documented
      failure list from a production environment is worth more than ten benchmark tables when you are
      planning your own rollout.

      '
  pi0-deploy-notes:
    why: Documents the adaptation steps for hardware outside the pretraining distribution — the case where
      most teams actually get stuck.
  lerobot-rtc-docs:
    why: 'Read this to learn what the parameters mean — and note the documented limitation: the docs state
      that `inference_delay` "should be calculated based on the inference latency of the policy" and do
      not tell you how. Measuring that number is the single highest-value hour you can spend before enabling
      RTC, and the how is in docs/41-real-time-inference.md.

      '
  lerobot-async:
    why: 'The cleanest existing template for the two-clock design in docs/41. Worth reading for the queue-merge
      policy alone, because that is where the subtle bugs live — whether to drop or blend a late chunk,
      and what the client does when the server goes quiet.

      '
  lerobot-rollout:
    why: 'The closest thing to a shipped operations control loop in a mainstream framework, and the most
      under-appreciated document in this stack. Most teams build incident capture from scratch, badly.
      If you adopt one thing from this repo, adopt the ring-buffer capture — the episodes where the policy
      fails are exactly the data you need, and they are the ones you will not think to record.

      '
  lerobot-hil:
    why: 'The practical route to the recovery data that long-horizon policies need. Correction data from
      the policy''s own failure states is the one thing that addresses covariate shift, and having it
      built into the rollout loop is what makes it actually happen rather than being planned and never
      collected.

      '
  ros2-control-trajectory:
    why: 'This is where chunk interpolation actually lives, and it is the answer to a question most VLA
      write-ups skip entirely: a policy emits 10-50 discrete setpoints, but the servos want a continuous
      command. Push chunks here rather than commanding setpoints directly at the policy''s rate. Choose
      the spline order deliberately — and note that interpolation also *hides* policy error, which is
      a feature until you are debugging.

      '
  ros2-control-admittance:
    why: 'The controller-layer answer to contact-rich tasks that a position-controlled learned policy
      cannot handle on its own. A policy trained on position trajectories will fight the environment;
      an admittance layer absorbs that. Worth knowing it exists before you conclude your policy needs
      to learn compliance.

      '
  ros2-control-gripper:
    why: 'Relevant to the gripper action-representation problem: normalised 0-1 versus metres versus effort
      is decided per project with no consensus, which is why gripper conventions are a recurring source
      of porting bugs. This gives you the controller-side interface to map onto.

      '
  neural-controller:
    why: 'One of only two good open-source bridges between a learned policy and a real-time control framework.
      The architectural advantage is real: the policy becomes a peer of the trajectory controller rather
      than an external process racing it, which removes a whole class of timing bugs.

      '
  xbotics-ch13:
    why: 'The most complete published decomposition of the VLA latency problem found in any language,
      and it is the reason the gap in this repo is narrower than we first claimed: the *framework* for
      decomposing the budget does exist, in Chinese, and it is good. What is still missing is filled-in,
      per-stage, measured numbers on a specific stack — which is what docs/40-optimization-matrix.md asks
      contributors to produce. Read this before reading the RTC paper; the derivation is clearer than
      the paper''s.

      '
    notes: 'The chapter also argues the field needs three complementary layers rather than one fix — algorithms
      that change how chunks are generated and joined (RTC, FASTER, Legato), systems work that reduces
      single-inference cost, and learned/speculative methods that push average latency down once inference
      is already fast. The wider course is organised around the claim that embodied AI''s difficulty is
      the whole system chain — perception, control, data, training, deployment, and failure feedback —
      and it applies a five-category failure framework per lecture with post-mortems: vision, action,
      timing, target pose, and data coverage. That is a **different axis from this repo''s troubleshooting
      section**, which is organised by symptom. Ours answers "what do I see, and what is it"; theirs answers
      "which part of the system is implicated". Worth reading both, and worth knowing that a category
      that never appears in your own post-mortems is usually one you have not instrumented yet.

      '
  faster:
    why: 'Directly attacks the limit RTC leaves in place. Under a fixed denoising schedule, the action
      expert''s N steps dominate latency and the reaction time is roughly `L + (s/2)·T_c` regardless of
      how smoothly chunks are joined. If your task is dynamic rather than merely long, this is the relevant
      axis, not chunk-boundary smoothness.

      '
  legato:
    why: 'A learned route to the same goal as RTC''s inference-time guidance: reduce how often you pay
      full inference cost, rather than patching the seams after the fact. Note the tradeoff against RTC
      — guidance is training-free and costs ~28% extra inference, while a learned continuation requires
      a training run but changes the cost structure itself.

      '
  delay-aware-diffusion:
    why: 'Attacks the staleness term in the latency budget at training time instead of masking it at the
      chunk seam. This is the counterpart to RTC: RTC makes the joint between chunks smooth while leaving
      the frozen window locked, whereas a delay-aware policy has seen delayed observations during training
      and can act sensibly on them. If your measured `d` is large and your task is dynamic, this is the
      more principled direction.

      '
  speculative-policy-orchestration:
    why: 'The clearest statement that over-the-network inference is a safety problem rather than a performance
      problem. Read it before deciding to put the policy on a server, and use its framing — command starvation
      — when you argue for a local fallback path.

      '
  roboecc:
    why: 'Relevant when a single onboard device cannot host the whole model. The interesting part for
      deployment is the split point, because it determines what your robot can still do when the link
      degrades.

      '
  comvla:
    why: The bandwidth-constrained half of the offload problem; complements RoboECC's compute-side view.
  viam-calibration-worksheet:
    why: 'Rare and directly reusable: most calibration material is library documentation, which tells
      you how to call the function but not what a complete calibration record looks like. This is a checklist
      artifact, and it is the kind of thing that prevents the "checkpoint validated against which calibration"
      problem. Adapt it into checklists/calibrate-a-new-robot.md rather than copying it wholesale.

      '
  ros2-control-mock:
    why: 'The closest official tooling to hardware-in-the-loop testing for a policy, with an honest caveat:
      it tests controller plumbing, not the policy. Still worth using to validate your command path, limits
      and watchdog wiring before touching hardware — that is where the cheap bugs are.

      '
  ros2-tracing:
    why: 'The measurement tool for the latency budget this repo keeps asking you to fill in. Instrumenting
      a real control loop without perturbing it is genuinely hard; this is the maintained way to do it
      in ROS 2.

      '
  tensorrt-dev-guide:
    why: 'The constraint reference to consult *before* promising an export path. Most failed VLA exports
      fail on a specific unsupported operator or a dynamic-shape construct, and this is where you find
      out whether yours is supported rather than discovering it after writing the export script.

      '
  vla-eval-harness:
    why: Reduces the amount of bespoke evaluation plumbing you have to write, which is usually where evaluation
      rigour is lost.
  simplerenv:
    why: 'Useful as a cheap screening filter between training runs so you do not spend robot time on obviously
      bad checkpoints. Treat it as a screen, not as evidence of deployment readiness — the visual and
      contact fidelity gaps that matter on hardware are exactly what a simulator tends to miss.

      '
  robocasa:
    why: Broad task coverage for pre-deployment sanity checks and for generating targeted recovery data.
  eval-statistical-bounds:
    why: 'Turns "we got 7 out of 10" into a defensible statement. Most real-robot evaluations in this
      field report point estimates from trial counts that cannot support the comparisons being drawn,
      and this gives you the bound instead.

      '
  phail-benchmark:
    why: 'Answers the question every evaluation actually faces: when am I allowed to stop running trials.
      Pair it with the sequential and anytime-valid stopping work, which lets you stop as soon as the
      answer is determined instead of pre-committing to a fixed trial count and burning robot time on
      a difference that is already unambiguous.

      '
    notes: 'Our entry name previously read "Sequential / anytime-valid stopping rules for robot evaluation",
      which is a description of one contribution rather than the paper''s identity. Renamed after scripts/check_papers.py
      compared it against the arXiv record — a small instance of exactly the mislabelling that script
      exists to catch.

      '
  eval-optimal-stopping:
    why: 'The 10-50 trial regime is where almost all published robot evaluations live, and it is precisely
      where naive statistics break down. This is the closest thing to a protocol for the situation you
      are actually in.

      '
  libero-reproduction-gap:
    why: 'If you reproduce a published number with the default settings and get something worse, this
      is a plausible reason before your training recipe is. It is also the clearest illustration of why
      an evaluation protocol has to be reported rather than assumed: the same benchmark, the same checkpoint,
      and a 25x difference in evidence.

      '
  score-the-steps:
    why: 'The highest-leverage change to a real-robot evaluation protocol in this list. A success rate
      from 30 trials is one number built from 30 bits, which is why it cannot resolve a five-point difference.
      A per-subgoal progress curve gives you many more observations per expensive trial — and it tells
      you *where* the policy fails, which is the thing you actually need in order to fix it. If you change
      one thing about how you evaluate, change this.

      '
  failure-taxonomy-cluster:
    why: 'Use these as starting points rather than inventing your own labels from scratch — but do not
      expect them to agree. The actionable part is Guardian''s split: when a rollout fails, "it chose
      the wrong thing to do" and "it did the right thing badly" call for completely different fixes, and
      collapsing them into one failure count is how teams end up collecting more data when the problem
      was the instruction. This is also why this repo does not publish a single canonical taxonomy: the
      field does not have one, and pretending otherwise would be exactly the kind of unearned confidence
      the provenance policy exists to prevent.

      '
  robotwin2:
    why: 'Fills the two weaknesses this repo keeps flagging in the popular sim benchmarks: LIBERO and
      SimplerEnv are largely single-arm and comparatively light on visual randomisation, so a policy can
      score well on them and still fail the first time the lighting changes. If you want a sim screen
      that has a chance of predicting deployment, bimanual coverage and randomisation strength are the
      two properties to select for.

      '
  evaluation-resolution:
    why: 'This is the most useful single number for reading robot-learning results, including your own.
      Fourteen points of apparent improvement, from nothing but which checkpoint snapshot you looked at
      and how many trials you ran. It is the concrete version of the statistical papers in this section:
      they tell you the bounds, this tells you the size of the effect in the regime everyone actually
      operates in. Practical version: write down the trial count and the initial-state list before you
      start, and when a colleague reports a five-point win, ask for N first.

      '
  libero-three-numbers:
    why: 'Before concluding that your reproduction failed, check which of the three you are using. A 25x
      difference in evidence between two people who both say "we evaluated on LIBERO" is the clearest
      possible argument for reporting the protocol rather than naming the benchmark.

      '
  keon-awesome-physical-ai:
    why: 'DO NOT USE. It is the single most likely trap for a reader looking for deployment material.

      '
    notes: 'Verified on 2026-09-29: the Deployment and Safety sections contain 27 fabricated placeholder
      arXiv IDs of the form `2505.XXXXX` / `2512.XXXXX`, attached to real-looking names (BitVLA, QuaRT-VLA,
      RTC, ASIMOV, RoboGuard). `grep -c XXXXX` on this file returns 27; the same grep across 32 other
      READMEs in this space returns 0. The content reads as LLM-generated. Last commit 2026-06-24. Kept
      here, dated and labelled, because a reader will find it and needs to know.

      '
  vla-handbook:
    why: 'This is the closest thing to an existing occupant of our niche, and it proves the niche is real.
      It is 100% Chinese, which is exactly why an English-first equivalent is worth building. Read it
      if you read Chinese; it is strictly ahead of us on hardware specifics. Our differentiation is English
      reach, verified provenance, and measured numbers.

      '
    notes: 'Also distils 300+ Xiaohongshu posts, 165 English blogs, 135 LeRobot Discord threads and 200+
      GitHub issues, including a GPU compatibility matrix (RTX50/Jetson), pi0 fine-tune traps, GR00T VRAM
      requirements, and convergence-failure root causes.

      '
  awesome-embodied-vla-va-vln:
    why: Use it to find papers. It has essentially no engineering content — its 'quantization' hits are
      paper titles, not tooling.
  gt-ripl-awesome-llm-robotics:
    why: Background reading for the language side of VLA.
  awesome-humanoid-robot-learning:
    why: The teleoperation section is paper-level, but it is the best single index of teleoperation *systems*
      to start from.
  awesome-physical-ai-natnew:
    why: 'The strongest governance/standards coverage anywhere. But it never connects any of it to a running
      VLA inference loop: 0 TensorRT/ONNX/quantization, 0 e-stop/watchdog, 0 subtask, 0 data cleaning.
      That gap is our section 43.

      '
  aidaslab-data-curation:
    why: This owns the paper-level data lifecycle. We link here rather than re-curating the same papers
      — our data docs are about reproducible pipelines and thresholds instead.
    notes: Only ~11 stars. Treat 'well covered' as well-covered-in-content, not well-known.
  awesome-robot-data-engine:
    why: The best single reference for data-engine plumbing and format questions.
    notes: Only ~3 stars.
  awesome-long-horizon-robot-manipulation:
    why: The best existing index for the long-horizon failure modes that dominate real deployments — and
      it has 0 stars, which tells you how under-served this area is.
  awesome-vla-yueen-ma:
    why: Good orientation reading on model families.
  awesome-rl-vla:
    why: Relevant once you have a working SFT policy and want to push success rate with online data.
  every-embodied:
    why: The right link for someone starting from nothing. Not for someone already stuck.
  xbotics-handbook:
    why: Structured Chinese curriculum covering the theory our docs assume.
  action-diffusion-handbook:
    why: Complements VLA-Handbook on the action-representation side, which is where most 'it doesn't move'
      bugs live.
  dead-fkromer-awesome-ros2:
    why: Historically the ROS2 entry point. Useful as an archive; do not expect modern VLA integration
      guidance.
    notes: No commits since 2023-08.
  dead-awesome-il:
    why: Background on BC/DAgger lineage. Kept for the record, not recommended as a current reference.
    notes: No commits since 2023-08.
  dead-rfm-how-to:
    why: 'Worth reading as a cautionary example: the right idea, abandoned in 2024 at 7 stars. The lesson
      is that a list like this only survives if it is generated from data and checked by CI.'
    notes: No commits since 2024-06.
  nonexistent-resources:
    why: 'Recorded for the same reason `keon/awesome-physical-ai` is recorded: a reader will meet these
      names, and a plausible-looking dead end costs more time than an obviously missing one. "SimplerEnv-Plus"
      in particular is the kind of name that reads as a real successor and is easy to propagate into a
      citation list without checking. The general rule this repo enforces mechanically: **resolve it before
      you cite it.** `scripts/check_links.py` fails the build on an unresolvable URL, and `scripts/check_papers.py`
      verifies that an arXiv ID is the paper you claim it is, because a search snippet can attach arbitrary
      text to an identifier.

      '
  seo-contamination:
    why: 'VLA training is now a popular enough topic that content farms outrank primary sources, and the
      numbers they repeat drift. The rule this repo enforces: **cite the paper, the repo, or the issue
      — never a page that merely cites one.** If a figure matters to a decision, follow it back to the
      artifact that measured it, and if it does not trace, treat it as unverified rather than as approximately
      right. This is the same failure mode as the fabricated arXiv IDs in the warning at the top of the
      README, and the same reason `scripts/check_papers.py` compares titles against the arXiv API rather
      than trusting a search snippet. Secondary summaries are useful for finding things; they are not
      evidence.

      '
    notes: 'Also recorded so nobody re-derives them as failures: Google Cloud GPU pricing is JavaScript-rendered
      and its calculator endpoint returns 404, and Vast.ai serves a loading page to scripts while its
      API returns 403. Neither can be verified automatically, so we quote neither.

      '
  pricing-provenance:
    why: 'The general rule, and the reason this entry exists rather than a rate table: **when a number
      comes from a catalogue, cite the catalogue, not a page that paraphrases it.** The machine-readable
      endpoint is also the artifact that does not silently change under you, and it is the one a script
      can re-verify — which is why the only price-related figures in this repo are ones we could check
      mechanically. This is the same discipline as the two other provenance entries here: the fabricated
      arXiv IDs, and the SEO-contaminated cost and accuracy claims. In each case the failure is a secondary
      source drifting from a primary one, and in each case the fix is to go one level closer to whatever
      measured the number.

      '
    notes: 'We do not publish a provider rate table at all. Rates change faster than anything else this
      repo tracks, and a stale rate is worse than no rate because it looks authoritative.

      '
  pi0-license-contradiction:
    why: 'π₀ and π₀.₅ are the checkpoints most readers of this repo start from, and the licence on the
      weights is not the licence the documentation implies. The Gemma licence carries use restrictions
      that Apache 2.0 does not, and the difference is exactly the kind that matters at the moment you
      try to ship something rather than the moment you start experimenting. **Check this before you invest
      a week of fine-tuning, not after.** If your deployment cannot accept the Gemma terms, the practical
      alternatives with verifiable permissive licences are SmolVLA or OpenVLA — a materially different
      starting point that is worth knowing early. We are not asserting which licence is legally correct,
      and the discrepancy may be a packaging error that gets fixed. We are asserting that the two sources
      disagree and that you should resolve it for your own use case before building on it.

      '
  verify-license-from-api:
    why: 'This is the same rule as the other provenance entries in this repo, applied to the field where
      being wrong is most expensive: **go one level closer to the artifact than the page that describes
      it.** A documentation page is a claim about a model; the API field is the model''s own declaration.
      Two practical notes. A dataset or model card with **no** declared licence is not the same as a permissive
      one — treat an absent `license` field as unresolved, not as free to use. And a repo''s *code* licence
      is not its *weights* licence: openpi''s repository is Apache-2.0 while the checkpoints it ships
      are not, and conflating the two is an easy and consequential mistake.

      '
  dataset-license-spectrum:
    why: '"Non-commercial" is easy to spot and "no derivatives" is not, yet the second is the one that
      breaks a data pipeline: you can use EgoDex to train, but you may not be able to release the dataset
      you built on top of it. Anyone assembling a mixture for a product needs to check the no-derivatives
      clauses specifically rather than scanning for "non-commercial" and moving on. Treat the unconfirmed
      entries as leads to check, not as facts — that is the same standard the rest of this repo holds
      itself to, and licences are a domain where a confident wrong answer is worse than an explicit unknown.

      '
  dguv-ifa-cobot:
    why: 'Every standards link in this space resolves to a paywalled catalogue page, which is useless
      when you are trying to work out what the standard actually requires. This is the readable entry
      point, and it is the right place to start before buying anything. If a human shares your robot''s
      workspace, the power-and-force tables here are the numbers you need.

      '
  iso-21448-sotif:
    why: 'The right lens for a learned policy, and the one most often missing. Functional-safety standards
      ask whether a system is safe when it *malfunctions*; a policy does not malfunction, it competently
      does the wrong thing in a situation the training data did not cover. "No fault occurred" and "someone
      was hurt" are compatible, and SOTIF is the framework written for that shape of problem. In practice
      it forces you to state your operational design domain and argue coverage, rather than assuming it.

      '
  hide-and-seek-trajectories:
    why: 'The practical problem with supervised failure detection is that you never have a clean set of
      labelled failures — failures are rare, expensive, and labelled inconsistently. This attacks that
      directly, which is what makes it usable in a real project.

      '
  safecast:
    why: 'The listed shifts are exactly the ones that separate a lab demo from a deployment, and they
      are the ones an OOD monitor has to survive. Calibration matters here more than raw accuracy: a detector
      that fires constantly gets disabled by its operators, and then you have no monitor at all.

      '
  rafail:
    why: 'Read this one first for a real deployment, because it treats the monitor as a component with
      its own cost. A semantic check requiring a VLM forward pass competes with your policy for the same
      GPU, and on a tight control loop that competition is not free — you are slowing the policy or delaying
      the monitor, and you should choose which deliberately. Most monitoring work assumes the monitor
      is free.

      '
  rewind-il:
    why: 'The recovery half of graceful degradation, and the half almost everyone skips. A monitor with
      no bounded response is just a logging system; Rewind-IL pairs detection with a concrete action,
      which is what Layer 5 of docs/43-safety.md describes as scripted recovery primitives. Worth reading
      for the respawn semantics even if you implement the detection differently.

      '
  nvidia-halos:
    why: 'The most complete published architecture in this space, and useful as a reference structure
      even if you never adopt it. Note what it is: an architecture. There is still no reference implementation
      of a watchdog and limiter wrapping a learned policy — that is the gap docs/43-safety.md fills.

      '
  mender-ota:
    why: 'Relevant to the failure mode nobody plans for: you push a model update to the fleet, it regresses,
      and now you need to get back. Rollback semantics are the difference between a bad afternoon and
      a dead robot. Note the interaction with the checkpoint-to-calibration provenance gap — rolling back
      the model without rolling back the calibration is its own bug class.

      '
  openpi-requirements:
    why: 'The most concrete public answer to "what hardware do I need" for pi0 / pi0.5. The practical
      decision it settles for most teams: LoRA fits on a single 24 GB consumer card, full fine-tuning
      does not — and the repo does not tell you what the success-rate difference is, which is exactly
      the number you need to make that call.

      '
    notes: Quoted verbatim from the README section 'Requirements'.
  openpi-norm-stats:
    why: 'This is the document that decides whether your fine-tune converges. It also corrects a widespread
      piece of advice: openpi does NOT say "always recompute the statistics". It says to **try both**
      reloading the pretrained statistics and computing fresh ones, and keep whichever works better —
      reloading can be *better* when your robot matches a pre-training embodiment, because the actions
      then land in a range the model finds familiar.

      '
    notes: 'Reusing pre-training statistics only works if your action space follows the same convention.
      See the action-space entry below before assuming it applies to you.

      '
  openpi-action-space:
    why: 'The single highest-yield thing to check when porting a policy to a new arm. Two traps hide here:
      the gripper convention is inverted relative to many drivers (0 = open, not closed), and a control-frequency
      mismatch silently changes the physical duration of a fixed-length action chunk.

      '
  droid-action-space:
    why: 'A concrete instance of the general delta/absolute/velocity confusion, documented by the model
      authors. If you fine-tune on DROID data and deploy on a position-controlled arm — or the reverse
      — the policy will produce motion that is wrong in a way that looks like a bad model rather than
      a unit mismatch.

      '
  lerobot-pi05-recipe:
    why: 'The most directly copyable pi0.5 recipe that exists. The docs state the tradeoff for the frozen
      variant explicitly — "less memory, at some cost in success rate" — which is unusually honest, and
      is the only public statement of that tradeoff I found.

      '
  lerobot-pi0-recipe:
    why: 'Note the step count — 3000, an order of magnitude below the pi0.5 recipe''s 30000. If you copy
      a step count between these two models you will either under-train or waste days.

      '
  openpi-idle-filter:
    why: 'First-party confirmation that idle filtering is not a superstition — the model authors built
      it into the default recipe. This is the strongest available evidence for the episode-head idle hypothesis
      in the troubleshooting section, where a policy learns "at the reset state, do not move".

      '
    notes: 'The published index list is only valid for the `droid/1.0.1` dataset. For your own data, rerun
      the script — or compute the equivalent in `scripts/diag_dataset.py`, which reports episode-head
      idle contamination directly.

      '
  rtc-training:
    why: 'The difference between inference-time RTC, which patches over the chunk-boundary discontinuity,
      and training-time conditioning, which removes it. If you know your deployment latency at training
      time, this is the more principled fix.

      '
  openvla-ft-comparison:
    why: 'Two conclusions that change how you configure a fine-tune. First, LoRA applied to all linear
      layers matches full fine-tuning at 1.4 % of the parameters and roughly a third of the memory — LoRA
      is not the problem people blame it for. Second, and more important: **which modules you update dominates
      how many.** Freezing the vision encoder costs about 22 points and training only the last layer costs
      about 39. If you are choosing between LoRA configurations, choose by which modules are in the target
      list, not by rank.

      '
    notes: 'The error bars overlap between full FT and LoRA rank 32, which is the honest reading: at 33
      trials you cannot distinguish them. Both being ~68-70 % while frozen-vision is 47 % is the signal.

      '
  lerobot-lora-target-trap:
    why: 'This is the highest-value practical finding in the training section, and it is a trap that looks
      like a data problem. A fine-tune that sits at 0 % success while the loss decreases normally is the
      signature, and the cause is a parameter budget you never chose deliberately. It also corrects a
      widespread misconception: the quantity to match across models is the trainable *fraction*, not the
      rank — the same rank 64 is 2.1 % of SmolVLA but roughly 0.58 % of pi0, because the two models have
      very different numbers of attention sites.

      '
    notes: 'Two command-surface details from the same source. Use `--peft.method_type` / `--peft.r` to
      attach a new adapter to a clean base; setting `--policy.use_peft=true` instead makes the framework
      treat `--policy.path` as an already-trained adapter directory, so pointing it at a base model reads
      a base model as an adapter. And the acceptance test is to read `num_learnable_params` out of the
      training log rather than trusting your CLI flags — without `--policy.freeze_vision_encoder=false
      --policy.train_expert_only=false`, SmolVLA reports about 100 M trainable instead of about 403 M.

      '
  pi05-small-dataset-quantile:
    why: 'Directly relevant to the most common real symptom in this repo — a policy that produces small
      or hesitant motion. If quantile normalisation on a small dataset compresses the action range, then
      both the training targets and the decoded outputs are scaled down, and the robot moves less than
      it should while the loss looks healthy. Check this before concluding that your data is bad.

      '
  pi05-config-drift:
    why: 'The recommended remedy generalises to every fine-tune in this space: use the shipped config
      verbatim first, confirm it reproduces, then change exactly one thing at a time. And diff your own
      `TrainConfig` field by field against the reference config rather than assuming your CLI flags produced
      the config you intended.

      '
  checkpoint-selection:
    why: 'Nobody publishes a criterion, only conventions — and the LIBERO-Goal exception matters because
      it means "train longer" is not reliably better. The useful move is to write your own stopping rule
      down before you start, because the alternative is choosing the checkpoint whose number you liked,
      which is how a fine-tune''s reported success rate becomes unreproducible.

      '
  evaluation-noise-floor:
    why: 'A five-point noise floor means a five-point improvement is not a result. Measure your own floor
      by running the identical configuration twice before you compare two configurations — it is one of
      the cheapest experiments available and it prevents most of the false conclusions in this space.

      '
  horizon-ablations:
    why: 'Two practice-changing readings, and they contradict the two reflexes people have. **The chunk-size
      curve is an inverted U with a wide flat top between 10 and 50** — there is no magic number, but
      1 and 100 are both clearly worse, so "as long as possible" and "one step at a time" are both wrong.
      **The execution-horizon curve is steeper** (80.3, 82.8, 70.8, 51.8), and executing the whole predicted
      chunk is the worst setting tested. So the rule is **predict long, execute short**: the prediction
      horizon is a capacity knob and the execution horizon is a responsiveness knob, and they trade off
      in opposite directions. The cross-policy ratio gives you a defensible default: `H ~= 2 * s`. And
      a corollary that is easy to get backwards — **if you adopt RTC, you extend the prediction horizon,
      not the execution horizon**; RTC''s guidance needs a long enough chunk to have something to reconcile
      against (roughly 32 or more), while the execution horizon is exactly what it is trying to keep short.

      '
    notes: 'A caution about reading the paper past the tables: SmolVLA''s own real-world setup executes
      the **full** chunk synchronously while its simulation evaluation re-observes every step. That is
      an internal inconsistency, not a recommendation — do not copy it.

      '
  normalization-three-regimes:
    why: 'Sharpens the advice that you must match the mode to the checkpoint: this is not a one-off mismatch
      between two projects, it is three live cases inside a single lineage. Combined with the finding
      that quantile is only marginally better than mean/std once the action convention is correct, the
      practical rule is: read the mode off the checkpoint and do not have an opinion about which is better.

      '
  fsq-tokenizer-trap:
    why: 'A reader skimming the repository for "how does pi0 tokenise actions" will find this file and
      conclude the wrong thing. Recorded because it is cheap to state and expensive to discover — you
      would build a training pipeline around the wrong tokenizer before noticing.

      '
  lerobot-relative-action-floor:
    why: 'On an older install you will find documentation for a feature your code does not have, which
      is a confusing failure mode: the flag is accepted-looking in the docs and absent in the source.
      Pin your revision and check the flag exists before following a tutorial — including this one. More
      generally, most of the practical knowledge in this repo is attached to a specific commit, and the
      entry-level `verified` date is not a version.

      '
  vram-boundary-counterevidence:
    why: 'Two things worth planning around. The published VRAM number is a boundary rather than a comfortable
      figure: ">22.5 GB" and "24 GB" are close enough that whether you fit depends on the batch size,
      sequence length and which variant you picked, so treat 24 GB as a try-it-and-see rather than a yes.
      And the DDP result is a reminder that multi-GPU does not automatically mean faster — it replicates
      the model, so it reduces wall-clock only when the per-step work is genuinely parallelisable and
      the bottleneck is not elsewhere.

      '
  fine-tune-cost-anchor:
    why: 'Fine-tuning is cheap enough that the dominant cost of a project is not compute, it is the days
      you spend collecting data and debugging. That reframes decisions: an extra ablation run costs single-digit
      dollars, so run it rather than arguing about it, and spend the saved time on the data pipeline.

      '
    notes: '**The dataset behind that run is simulated.** It is MuJoCo-generated by a scripted IK oracle
      rather than collected on a real robot, so the figure is a valid **compute and cost** reference and
      is **not** evidence that a real pi0.5 fine-tune needs that much data or that much wall-clock. We
      nearly published it as a data-requirement data point; the distinction matters because cost and data
      volume are the two things people most want to infer from a worked example, and this example only
      supports one of them. Prices also move, and a rendered pricing page and the provider''s own machine-readable
      catalogue can disagree. Prefer the machine-readable catalogue: for Hugging Face Jobs, the hardware
      API reports `a100-large` at $0.041667 per minute, which is $2.50 per hour. We deliberately publish
      no provider rate table — it would rot faster than anything else here.

      '
  multi-gpu-not-auto-scaled:
    why: 'Moving from one GPU to eight changes your effective batch size, and therefore the training dynamics,
      without changing the numbers you passed. If you scale hardware between runs and compare the results,
      you have changed two things at once. Keep the effective batch size fixed when you add devices, or
      treat the change as a hyperparameter search rather than a speedup.

      '
  demos-is-the-wrong-unit:
    why: 'This is the correction that makes data-requirement numbers comparable across sources, and almost
      nobody states it. "50 episodes" from a lab with 8-second episodes and "50 episodes" from a lab with
      60-second episodes differ by a factor of seven in actual data, so the two figures are not the same
      claim even though they look identical in a table. When you read a requirement, convert it; when
      you report one, report both. It also reframes collection planning usefully: you are buying minutes
      of demonstration, and episode length is a lever you control.

      '
  aalto-execution-horizon:
    why: 'This upgrades "predict long, execute short" from a plausible heuristic to a tested finding.
      We already carry SmolVLA''s Table 13, which points the same way but is a single-run ablation; this
      is the version with paired sampling and an explicit significance test, and it puts a number on the
      cost of getting it wrong: **halving success if you execute the whole chunk.** The offline-selectability
      result is the practically useful half. Execution horizon is normally something you sweep with robot
      time, and here is evidence you can estimate it from trajectories you already have.

      '
    notes: 'Read alongside ACT''s ablation (1% at k=1 rising to 44% at k=100, degrading at k=200 and 400)
      and you get an apparent contradiction: ACT peaks at 100 while these policies peak at 10-15. It is
      not a contradiction — the optimum scales with the control rate and the length of the motion primitive,
      not with the paper you copied. Scale your horizon to your own control loop.

      '
  openvla-demo-replay:
    why: 'A benchmark dataset, published by competent people, with 9 to 24 percent of its demonstrations
      failing the task they are labelled as succeeding at. If you are blaming your model for a poor result
      on public data, this is the prior that should make you replay your own data first. It also generalises:
      the cheapest quality gate in this entire repo is to replay every demonstration in simulation and
      check whether it actually solves the task — and it is a gate almost nobody runs before training.
      The 180-degree rotation is a reminder that visual conventions are undocumented and silent, the same
      failure family as the gripper polarity entry.

      '
  checkpoint-write-oom:
    why: 'A late-failure class worth knowing about, because it appears long after you have concluded the
      configuration works. Memory pressure at save boundaries is not visible in the step-time or loss
      curves, so the only defence is to size the run for peak memory including the save path, or to test
      a save early rather than discovering the limit at hour twenty.

      '
  openpi:
    why: The reference codebase if you are fine-tuning pi0.5. Its config files are the de-facto specification
      for normalisation statistics, action horizons and the discrete-state input convention — most 'the
      policy ignores the state' bugs trace back to a mismatch here.
  lerobot:
    why: The lowest-friction path from a real robot to a trained policy, and the dataset format the rest
      of the ecosystem has converged on.
  isaac-gr00t:
    why: The main alternative foundation-model family to pi0. Check VRAM requirements before committing
      — they are widely reported as the deciding constraint.
  openvla:
    why: Historically important and widely benchmarked. Its autoregressive discrete-action design has
      very different latency characteristics from flow-matching policies — relevant if your control rate
      is tight.
  openvla-oft:
    why: Reports large throughput gains over vanilla OpenVLA fine-tuning. A useful worked example of how
      much the action head design, rather than the backbone, dominates inference cost.
  rdt-1b:
    why: The main open bimanual foundation model outside the pi0/GR00T families. Its unified action space
      is worth studying if you are targeting cross-embodiment transfer.
    notes: The obvious URL `thu-ml/RDT` is a 404. Use this one.
  octo:
    why: Smaller and cheaper to fine-tune than the 3B+ models. A reasonable choice when you have modest
      data and a modest GPU.
  fluxvla:
    why: An alternative to assembling openpi + LeRobot + your own glue. Read the docs before writing that
      glue — you may not need to.
  rlinf:
    why: One of very few public, end-to-end worked examples that goes from fine-tuning to a specific real
      arm. Worth reading even if you do not use the framework.
  vla-foundry:
    why: A second independent implementation to compare against when you suspect a bug in your own training
      loop.
  openpi-tool:
    why: 'Exactly the kind of content search engines bury and practitioners need. Chinese-language pi0.5
      recipes are systematically better documented than English ones because the community around them
      is larger.

      '
  pi05-xarm-tutorial:
    why: A concrete worked example of adapting pi0.5 to an arm that is not in the pretraining mix — the
      exact situation where normalisation and action-space mismatches bite.
  df-post-training:
    why: Useful reference point on what post-training actually changes, and how much it costs.
  lerobot-realman:
    why: Another non-reference-embodiment port. Ports like this are where the undocumented assumptions
      in a codebase become visible.
  xpolicylab:
    why: Handy for comparing policy families without rewriting your training harness per model.
