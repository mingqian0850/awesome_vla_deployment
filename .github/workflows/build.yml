name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      # The README is a build artifact. If it differs from what the data generates,
      # someone edited it by hand and the two have drifted.
      - name: README is up to date
        run: python scripts/build_readme.py --check

      # Provenance policy: every link must resolve. A popular list in this space has been
      # found to contain fabricated arXiv IDs, so this is enforced rather than aspirational.
      - name: All links resolve
        run: python scripts/check_links.py

      # Resolving is not the same as being the right paper. Search-result snippets can attach
      # arbitrary text to an arXiv ID, and a checker that only confirms 200 would publish a
      # mislabelled paper. This queries the arXiv API and compares titles.
      - name: arXiv references are the papers we claim
        run: python scripts/check_papers.py
