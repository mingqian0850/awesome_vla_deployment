section: Troubleshooting
order: 90
description: Symptoms, checks and corrective actions. Check order is a diagnostic workflow, not a measured
  probability ranking.
symptoms:
- id: only-first-action
  symptom: Only the first subtask executes
  severity: high
  causes:
  - cause: The rollout loop consumes too few actions.
    rank: 0
    test: Log chunk shape and actual commands sent per inference.
    fix: Set execution depth explicitly and evaluate several depths.
    cause_zh: 执行循环没有按预期消费动作块。
    test_zh: 记录动作块形状及每次推理后实际发送的指令数。
    fix_zh: 显式设置执行步数，并对多个值进行评测。
  - cause: The delta transform is applied twice.
    rank: 1
    test: Check dataset action semantics and the transform chain against reconstructed joint targets.
    fix: Apply the delta conversion exactly once; test the inverse conversion on recorded samples.
    sources:
    - https://github.com/Physical-Intelligence/openpi/issues/1047
    - https://github.com/Physical-Intelligence/openpi/pull/971
    cause_zh: 增量动作变换被重复应用。
    test_zh: 根据重建的关节目标核对数据动作含义和变换链。
    fix_zh: 只执行一次增量转换，并在已记录样本上测试逆转换。
  - cause: The observation does not identify the current task phase.
    rank: 2
    test: Compare similar observations from different phases and their required actions.
    fix: Provide phase labels, history or another observable progress signal supported by the policy.
    cause_zh: 观测无法区分当前任务阶段。
    test_zh: 比较不同阶段的相似观测及各自所需动作。
    fix_zh: 根据策略支持的接口，提供阶段标签、历史或其他可观测进度信号。
  - cause: The state input is constant, mis-scaled or disconnected.
    rank: 3
    test: Inspect per-dimension statistics and change state inputs while holding images fixed.
    fix: Match state order, scaling and input mode to the checkpoint's actual configuration.
    sources:
    - https://github.com/Physical-Intelligence/openpi/blob/main/src/openpi/models/pi0_config.py
    cause_zh: 状态输入恒定、尺度错误或未接入模型。
    test_zh: 检查各维统计量，并在图像固定时改变状态输入。
    fix_zh: 使状态顺序、尺度和输入方式匹配检查点的实际配置。
  - cause: Predictions barely change across observations.
    rank: 4
    test: Compare action chunks across distinct observations and multiple sampling seeds.
    fix: Inspect conditioning and trainable modules; evaluate a small controlled training run.
    cause_zh: 预测动作几乎不随观测变化。
    test_zh: 比较不同观测与多个采样随机种子下的动作块。
    fix_zh: 检查条件输入和可训练模块，再进行小规模受控训练评测。
  - cause: Idle episode starts dominate the reset state.
    rank: 5
    test: Plot action magnitude near each episode start.
    fix: Trim unintended idle spans while preserving timestamps and observation-action alignment.
    sources:
    - https://github.com/Physical-Intelligence/openpi/blob/main/examples/droid/README_train.md
    - https://arxiv.org/abs/2503.06669
    cause_zh: 每条轨迹起始的空闲段影响了复位状态下的动作。
    test_zh: 绘制每条轨迹开始附近的动作幅度。
    fix_zh: 裁剪非预期空闲片段，同时保持时间戳及观测动作对齐。
  - cause: Later phases are absent from the policy's visited-state distribution.
    rank: 6
    test: Evaluate from intermediate states and inspect phase coverage.
    fix: Collect recovery demonstrations and later-phase starts, then reevaluate the full task.
    cause_zh: 策略实际访问的状态缺少后续阶段示教覆盖。
    test_zh: 从中间状态启动评测，并检查各阶段覆盖率。
    fix_zh: 补采恢复示教和后续阶段起始状态，再评测完整任务。
  - cause: Normalization compresses the effective action range.
    rank: 7
    test: Compare raw, normalized and decoded actions per dimension with the checkpoint statistics.
    fix: Compare compatible pretrained and recomputed statistics using the same evaluation protocol.
    sources:
    - https://github.com/Physical-Intelligence/openpi/issues/763
    - https://github.com/Physical-Intelligence/openpi/issues/692
    - https://github.com/Physical-Intelligence/openpi/blob/main/src/openpi/training/config.py
    cause_zh: 归一化压缩了有效动作范围。
    test_zh: 逐维比较原始、归一化和解码后的动作，以及检查点统计量。
    fix_zh: 在同一评测协议下比较兼容的预训练统计量与重算统计量。
  sources:
  - https://mlanthology.org/corl/2025/jain2025corl-enabling/
  - https://arxiv.org/abs/2509.07953
  symptom_zh: 只执行第一个子任务
- id: stalls-at-start
  symptom: The robot hesitates at rollout start
  severity: medium
  causes:
  - cause: Recording includes an unintended idle prefix.
    rank: 1
    test: Inspect the first seconds of recorded actions and video.
    fix: Adjust recording boundaries and trim idle prefixes consistently.
    cause_zh: 记录包含非预期的起始空闲段。
    test_zh: 检查记录开始数秒内的动作与视频。
    fix_zh: 调整录制边界，并一致地裁剪起始空闲段。
  - cause: The first observation is stale or incomplete.
    rank: 2
    test: Log capture time and validity of each sensor before the first inference.
    fix: Wait for synchronized valid inputs and warm up inference before enabling motion.
    cause_zh: 第一次观测陈旧或不完整。
    test_zh: 在首次推理前记录各传感器的采样时间与有效性。
    fix_zh: 在启用运动前等待有效且同步的输入，并预热推理。
  symptom_zh: 机器人在执行开始时迟疑
- id: stutter-and-stop
  symptom: Motion alternates between bursts and pauses
  severity: high
  causes:
  - cause: Replanning and execution horizons are poorly matched.
    rank: 1
    test: Plot inference times, executed steps and action jumps at chunk boundaries.
    fix: Tune execution depth and validate how consecutive chunks are joined.
    cause_zh: 重规划与执行步数不匹配。
    test_zh: 绘制推理时间、执行步数及动作块边界的指令跳变。
    fix_zh: 调整执行步数，并验证连续动作块的衔接方式。
  - cause: The command buffer empties before new actions arrive.
    rank: 2
    test: Compare remaining buffer time at inference launch with measured latency and jitter.
    fix: Use overlapping inference where supported and define a controller-approved timeout response.
    cause_zh: 新动作到达前指令缓冲区已耗尽。
    test_zh: 比较推理启动时的剩余缓冲时间与实测延迟、抖动。
    fix_zh: 在支持时使用重叠推理，并定义控制器允许的超时响应。
  - cause: Action meaning or control frequency differs from training.
    rank: 3
    test: Inspect absolute/delta conventions, units and command timestamps.
    fix: Match the policy's action contract and explicitly adapt the controller interface.
    cause_zh: 动作含义或控制频率与训练阶段不同。
    test_zh: 检查绝对或增量约定、单位和指令时间戳。
    fix_zh: 匹配策略动作约定，并显式适配控制器接口。
  symptom_zh: 运动时走时停
- id: chunk-tail-garbage
  symptom: Later actions in a chunk are incorrect
  severity: high
  causes:
  - cause: Episode-tail padding contributes incorrect training targets.
    rank: 1
    test: Inspect targets and validity masks across an episode boundary.
    fix: Use the model's supported padding convention and mask invalid targets.
    cause_zh: 轨迹末尾填充产生了错误训练目标。
    test_zh: 检查 episode 边界附近的目标与有效性掩码。
    fix_zh: 使用模型支持的填充约定，并屏蔽无效目标。
  - cause: Future actions contain unresolved alternative behaviors.
    rank: 2
    test: Compare sampled chunks against distinct valid demonstration continuations.
    fix: Improve phase conditioning or shorten execution depth, then measure task success.
    cause_zh: 未来动作存在未消解的多种行为模式。
    test_zh: 将采样动作块与示教中的不同有效后续行为比较。
    fix_zh: 改善阶段条件输入或缩短执行步数，再测量任务成功率。
  symptom_zh: 动作块后半段错误
- id: ignores-instruction
  symptom: Instructions do not change behavior
  severity: high
  causes:
  - cause: The prompt is dropped before tokenization.
    rank: 1
    test: Inspect the final text and token IDs passed to the policy.
    fix: Correct feature names and observation transforms, then test contrasting instructions.
    cause_zh: 提示文本在分词前被丢弃。
    test_zh: 检查最终传给策略的文本与 token ID。
    fix_zh: 修正特征名与观测变换，再测试含义不同的指令。
  - cause: A global instruction does not identify the active subtask.
    rank: 2
    test: Check whether identical inputs require different phase-dependent actions.
    fix: Use supported subtask labels or history and verify the labels reach the model.
    cause_zh: 全局指令无法标识当前子任务。
    test_zh: 检查相同输入是否在不同阶段要求不同动作。
    fix_zh: 使用策略支持的子任务标签或历史，并确认标签实际进入模型。
  - cause: The action predictor is weakly coupled to language.
    rank: 3
    test: Hold the scene fixed and request different visible targets over repeated trials.
    fix: Check data-task correlations and conditioning; evaluate language following separately from nominal
      success.
    cause_zh: 动作预测与语言条件耦合较弱。
    test_zh: 固定场景，多次要求选择不同的可见目标。
    fix_zh: 检查数据任务相关性与条件输入，并单独评测指令服从能力。
  symptom_zh: 改变指令不改变行为
- id: fails-on-new-robot
  symptom: A policy fails on a different robot
  severity: high
  causes:
  - cause: Statistics are missing or incompatible with the embodiment.
    rank: 1
    test: Inspect loaded mean/std or quantiles, units and per-dimension ranges.
    fix: Use compatible statistics and evaluate reuse versus recomputation; verify required fields exist.
    sources:
    - https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md
    - https://huggingface.co/docs/lerobot/en/pi05
    cause_zh: 统计量缺失或与机器人形态不兼容。
    test_zh: 检查实际加载的均值标准差或分位数、单位及各维范围。
    fix_zh: 使用兼容统计量，对比复用与重算结果，并检查必需字段。
  - cause: Joint order or action dimensions differ.
    rank: 2
    test: Compare raw action/state vectors with the robot joint definition.
    fix: Map dimensions explicitly and test the mapping with the actuator disabled first.
    cause_zh: 关节顺序或动作维度不同。
    test_zh: 将原始动作、状态向量与机器人关节定义逐项比较。
    fix_zh: 显式映射各维，并先在执行器禁用时测试映射。
  - cause: Gripper polarity is inverted.
    rank: 3
    test: Inspect adapter conventions and verify open/close in a controlled low-risk test.
    fix: Store the convention with the action schema and transform it once at the interface.
    sources:
    - https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md
    cause_zh: 夹爪开闭方向相反。
    test_zh: 检查适配器约定，并在受控低风险测试中确认开闭方向。
    fix_zh: 将约定记录在动作格式中，并只在接口处转换一次。
  - cause: Camera viewpoint or calibration has changed.
    rank: 4
    test: Compare captured frames, intrinsics and extrinsics with the training setup.
    fix: Restore the expected view or collect adaptation data for the changed setup.
    cause_zh: 相机视角或标定发生变化。
    test_zh: 比较采集画面、内参与外参与训练时的配置。
    fix_zh: 恢复预期视角，或为新配置采集适配数据。
  symptom_zh: 换机器人后策略失败
- id: sim-works-real-fails
  symptom: Simulation works but hardware does not
  severity: high
  causes:
  - cause: Execution errors lead to unseen states.
    rank: 1
    test: Compare expert-state prediction with closed-loop rollouts.
    fix: Collect recovery and intervention data covering the visited failure states.
    cause_zh: 执行误差使机器人进入未见状态。
    test_zh: 比较专家状态上的预测与闭环执行结果。
    fix_zh: 采集覆盖实际失败状态的恢复与介入数据。
  - cause: Visual or physical conditions differ from simulation.
    rank: 2
    test: Vary lighting, textures, friction and compliance independently where feasible.
    fix: Validate randomized simulation results against controlled real data.
    cause_zh: 视觉或物理条件与仿真不同。
    test_zh: 在可行时分别改变光照、纹理、摩擦和柔顺性。
    fix_zh: 用受控真机数据验证随机化仿真的结果。
  - cause: Simulation omits deployment delay.
    rank: 3
    test: Measure real observation-to-command delay and inject it into simulation.
    fix: Correct the timing architecture and evaluate delay robustness.
    cause_zh: 仿真没有建模部署延迟。
    test_zh: 测量真机从观测到指令的延迟，并注入仿真。
    fix_zh: 修正时序架构，并评测延迟鲁棒性。
  symptom_zh: 仿真成功而真机失败
- id: eval-numbers-not-trustworthy
  symptom: Success estimates vary between runs
  severity: medium
  causes:
  - cause: The evaluation sample is small.
    rank: 1
    test: Compute uncertainty intervals and inspect the number of independent trials.
    fix: Fix a trial protocol before comparison and report counts with intervals.
    cause_zh: 评测样本较少。
    test_zh: 计算不确定性区间，检查独立试验数量。
    fix_zh: 比较前固定试验协议，同时报告次数与区间。
  - cause: Initial conditions differ between runs.
    rank: 2
    test: Log object pose and task variant for every trial.
    fix: Use matched initial states and randomized condition order.
    cause_zh: 各轮初始条件不同。
    test_zh: 记录每次试验的物体位姿与任务变体。
    fix_zh: 使用匹配的初始状态，并随机排列测试条件。
  - cause: Temperature or calibration drifts during evaluation.
    rank: 3
    test: Repeat a reference condition at the beginning and end.
    fix: Interleave conditions and log thermal state and calibration checks.
    cause_zh: 评测期间温度或标定发生漂移。
    test_zh: 在评测开始和结束时重复同一参考条件。
    fix_zh: 交错测试各条件，并记录温度状态与标定检查。
  symptom_zh: 多次评测的成功率差异很大
- id: config-did-not-apply
  symptom: Configuration changes have no effect
  severity: high
  causes:
  - cause: Weight loading does not restore the expected settings.
    rank: 1
    test: Print the constructed configuration after checkpoint loading.
    fix: Pass required settings explicitly for the pinned version and verify their runtime values.
    sources:
    - https://huggingface.co/docs/lerobot/en/pi05
    cause_zh: 加载权重没有恢复预期配置。
    test_zh: 加载检查点后打印最终构建的配置。
    fix_zh: 针对固定版本显式传入必要设置，并核对运行时值。
  - cause: The normalization mode differs from the reference recipe.
    rank: 2
    test: Inspect the effective ACTION, STATE and VISUAL mappings.
    fix: Match the checkpoint's expected transforms and document intentional differences.
    sources:
    - https://huggingface.co/docs/lerobot/en/pi05
    cause_zh: 归一化方式与参考配方不同。
    test_zh: 检查 ACTION、STATE、VISUAL 实际采用的映射。
    fix_zh: 匹配检查点要求的变换，并记录有意保留的差异。
  - cause: A nested default overrides a command-line setting.
    rank: 3
    test: Compare parsed optimizer and trainer values with the intended values.
    fix: Use the version-correct parameter namespace and save the resolved configuration.
    cause_zh: 嵌套默认值覆盖了命令行设置。
    test_zh: 比较解析后的优化器、训练器参数与预期值。
    fix_zh: 使用当前版本正确的参数命名空间，并保存最终配置。
  - cause: A checkpoint contains older statistics.
    rank: 4
    test: Compare loaded statistics with the newly computed dataset statistics.
    fix: Update statistics through the supported checkpoint or processor workflow and verify loading again.
    sources:
    - https://huggingface.co/docs/lerobot/en/pi05
    cause_zh: 检查点包含旧统计量。
    test_zh: 比较实际加载的统计量与新计算的数据集统计量。
    fix_zh: 通过受支持的检查点或处理器流程更新统计量，再次核对加载结果。
  symptom_zh: 配置修改没有生效
- id: normalization-silently-skipped
  symptom: Normalization is skipped or incorrect
  severity: high
  causes:
  - cause: Statistic keys do not match the feature lookup.
    rank: 1
    test: Use known non-identity statistics and check the actual normalized values as well as the inverse
      round trip.
    fix: Repair key mapping; a round trip alone cannot detect two identity no-ops.
    sources:
    - https://github.com/huggingface/lerobot/issues/4415
    cause_zh: 统计量键名与特征查找键不匹配。
    test_zh: 使用已知的非恒等统计量，同时检查实际归一化数值与逆变换回环。
    fix_zh: 修复键映射；仅检查回环不能发现正反变换都被跳过的情况。
  - cause: Merged quantile summaries are not full-dataset quantiles.
    rank: 2
    test: Compare saved bounds with raw-data quantiles and the fraction of values outside them.
    fix: Compute quantiles over the intended sample population; distinguish a conservative envelope from
      exact quantiles.
    sources:
    - https://github.com/huggingface/lerobot/issues/4156
    - https://github.com/huggingface/lerobot/pull/3804
    - https://github.com/sawhney17/droid-quantile-repair
    cause_zh: 合并的分位数摘要不等于全数据分位数。
    test_zh: 将保存的边界与原始数据分位数、界外数值比例比较。
    fix_zh: 在目标样本总体上计算分位数，并区分保守包络与真实分位数。
  - cause: Camera or feature names differ between data and robot configuration.
    rank: 3
    test: Compare every declared feature with the statistics file keys.
    fix: Align names before training and deployment; fail clearly when required statistics are missing.
    sources:
    - https://github.com/huggingface/lerobot/issues/1095
    cause_zh: 数据与机器人配置中的相机或特征名不同。
    test_zh: 逐项比较声明的特征与统计文件键名。
    fix_zh: 在训练和部署前统一名称，缺少必需统计量时明确报错。
  - cause: Migration rewrites a feature name incorrectly.
    rank: 4
    test: Inspect underscore and dot handling in migrated statistic keys.
    fix: Use the policy's declared feature names and an explicit migration mapping.
    sources:
    - https://github.com/huggingface/lerobot/issues/4451
    cause_zh: 迁移流程错误改写了特征名。
    test_zh: 检查迁移后的统计量键名如何处理下划线和点号。
    fix_zh: 使用策略声明的特征名与显式迁移映射。
  symptom_zh: 归一化被跳过或结果错误
- id: fine-tune-zero-success
  symptom: Loss decreases but task success stays near zero
  severity: high
  causes:
  - cause: Adapter targets omit task-relevant modules.
    rank: 1
    test: Inspect actual trainable parameter names and counts.
    fix: Compare target coverage against a working reference and test a controlled adapter configuration.
    sources:
    - https://github.com/Xbotics-Embodied-AI-club/Xbotics-Embodied-AI-Handbook/blob/main/docs/part3-end-to-end/12-VLA%E5%BE%AE%E8%B0%83%E5%AE%9E%E6%88%98.md
    - https://huggingface.co/docs/lerobot/en/smolvla
    cause_zh: 适配器目标遗漏了与任务相关的模块。
    test_zh: 检查实际可训练参数的名称和数量。
    fix_zh: 与有效参考配置比较目标覆盖，并测试受控的适配器配置。
  - cause: An adapter directory is interpreted as a base model, or vice versa.
    rank: 2
    test: Inspect the loaded base checkpoint and adapter state separately.
    fix: Use the version-specific workflow for creating or resuming an adapter.
    sources:
    - https://github.com/Xbotics-Embodied-AI-club/Xbotics-Embodied-AI-Handbook/blob/main/docs/part3-end-to-end/12-VLA%E5%BE%AE%E8%B0%83%E5%AE%9E%E6%88%98.md
    cause_zh: 适配器目录被当作基础模型，或反之。
    test_zh: 分别检查已加载的基础检查点与适配器状态。
    fix_zh: 使用所用版本对应的适配器新建或恢复流程。
  - cause: Several settings drifted from the reference configuration.
    rank: 3
    test: Diff the complete resolved configuration, including statistics and action horizons.
    fix: Establish a reference baseline and change one factor per comparison.
    sources:
    - https://github.com/Physical-Intelligence/openpi/issues/711
    cause_zh: 多项设置偏离参考配置。
    test_zh: 比较完整的最终配置，包含统计量与动作步数。
    fix_zh: 先建立参考基线，每次对比只改变一个因素。
  symptom_zh: 损失下降但任务成功率接近零
- id: training-collapses-unexpectedly
  symptom: Training produces NaNs or unexpected loss scales
  severity: high
  causes:
  - cause: Pretrained weights did not load correctly.
    rank: 1
    test: Inspect missing keys and compare loaded tensor values with the checkpoint.
    fix: Pin compatible dependencies and verify loading before restarting training.
    sources:
    - https://github.com/huggingface/lerobot/issues/1406
    cause_zh: 预训练权重没有正确加载。
    test_zh: 检查缺失键，并将已加载张量与检查点比较。
    fix_zh: 固定兼容依赖，并在重新训练前验证权重加载。
  - cause: Near-zero action variance makes scaling unstable.
    rank: 2
    test: Inspect per-dimension variance and normalized-value ranges.
    fix: Handle constant dimensions explicitly and use a numerically appropriate denominator bound.
    sources:
    - https://github.com/Physical-Intelligence/openpi/issues/814
    cause_zh: 动作方差接近零，导致尺度变换不稳定。
    test_zh: 检查各维方差及归一化后数值范围。
    fix_zh: 显式处理恒定维度，并使用数值上适当的分母下界。
  - cause: Compilation changes numerical behavior.
    rank: 3
    test: Repeat the same batch with compilation enabled and disabled.
    fix: Isolate the failing operation and use a verified compiler configuration.
    sources:
    - https://github.com/huggingface/lerobot/issues/4178
    cause_zh: 编译改变了数值行为。
    test_zh: 在启用和禁用编译时重复运行同一批数据。
    fix_zh: 定位失败算子，并使用经过验证的编译配置。
  - cause: Resume did not restore adapters correctly.
    rank: 4
    test: Compare adapter values and trainable parameter counts before and after resume.
    fix: Restore model, adapter and optimizer state using a compatible checkpoint format.
    sources:
    - https://github.com/huggingface/lerobot/issues/3459
    cause_zh: 恢复训练时未正确恢复适配器。
    test_zh: 比较恢复前后的适配器数值与可训练参数数量。
    fix_zh: 使用兼容检查点格式恢复模型、适配器和优化器状态。
  symptom_zh: 训练出现 NaN 或异常损失尺度
section_zh: 排错
description_zh: 按现象、检查和处理组织。检查顺序是诊断流程，不是经统计测量的原因概率排序。
