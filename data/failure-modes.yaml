section: "Troubleshooting — symptom to root cause to fix"
order: 90
description: >
  Nothing comparable exists in English for VLA. Read the causes in order — they are ranked
  by how often they turn out to be the answer, not by how interesting they are. The `test`
  field is always something you can run in under an hour; run it before changing anything.
  Guessing at fixes here is how people lose weeks.

  Two scripts implement the tests referenced below:
  `scripts/diag_dataset.py` (data-side) and `scripts/diag_policy.py` (model-side).
symptoms:
  - id: only-first-action
    symptom: "The policy executes the first sub-task of a chained task, then stalls or repeats it — regardless of the initial state."
    severity: high
    frequency: "extremely common"
    causes:
      - cause: "The inference loop only consumes index 0 of the action chunk — a harness bug that is indistinguishable from a model failure."
        rank: 0
        test: >
          Read your own rollout loop before you touch the model. Print the shape of what the
          policy returns and the shape of what you send to the robot. A policy that returns a
          chunk of shape (H, action_dim) — for example GR00T returns (16, 7) — is trivially
          mis-consumed by a loop that indexes only the first row, and the resulting behaviour is
          a robot that performs one step of motion and then re-plans. From the outside that is
          the same symptom as every cause below it, so this costs five minutes to rule out and
          can save weeks of retraining.
        fix: >
          Decide the execution depth explicitly and write it down as a number, then verify the
          number of commands actually sent per inference against it. Be aware that the right
          depth is a tuned hyperparameter rather than a constant, and that published evidence
          points both ways: on one benchmark executing 16 steps beat executing fewer (90% to
          96%), while for one model the full 50-step chunk was the worst setting tested — 51.8%
          against 82.8% at an execution depth of 10. So do not simply "execute everything";
          sweep it, and treat the sweep as part of your evaluation rather than as plumbing.
        notes: >
          This cause sits above the model-level ones deliberately. When the symptom is "it only
          does the first action", the cheapest and most decisive test is to check whether the
          harness is capable of doing anything else.
      - cause: "The delta transform was applied twice, so the model is trained to predict a quantity that does not mean what anyone thinks it means."
        rank: 1
        test: >
          Print five consecutive `(state_t, action_{t:t+H})` pairs and check that `action_t -
          state_t` is small and centred. If it is roughly twice the size of the motion actually
          demonstrated, your data is already in delta form and you applied another delta
          transform on top. Measured on LIBERO: the actions are already `goal - current`, but
          `pi0_fast_libero` applies a delta transform again, so the model trains to predict
          `goal - 2*current`.
        fix: >
          Set `extra_delta_transform=False` when your dataset is already delta. **This is the
          largest single measured win in this entire repo**: LIBERO-10 goes from 60.5 +/- 1.0%
          to 84.7 +/- 1.7% with mean/std normalisation, and 75.1 +/- 1.5% to 85.9 +/- 0.6% with
          quantile, over 30k steps and three seeds, with no change to the model or the training
          code. Twenty-four points from a representation check that takes five minutes.
          The same experiment also settles a question people argue about: **once the action
          convention is correct, quantile normalisation is only marginally better than mean/std**
          (85.9 versus 84.7). The folklore gap between them is mostly this bug wearing a
          normalisation costume.
        sources: ["https://github.com/Physical-Intelligence/openpi/issues/1047",
                  "https://github.com/Physical-Intelligence/openpi/pull/971"]
        notes: >
          This is the general reason action-representation checks belong above hyperparameter
          tuning in your debugging order: a representation mismatch costs far more than any
          tuning choice, and it does not error, does not look wrong in the loss, and produces a
          policy that trains and then behaves strangely.
      - cause: "Phase aliasing — the same observation requires different actions in different phases, and nothing in the input says which phase you are in."
        rank: 2
        test: >
          Take each frame, find its K nearest neighbours in state space, and measure how
          spread out those neighbours are along normalised episode time. A mean spread above
          ~0.10 means states recur across phases. Run
          `python scripts/diag_dataset.py <dataset> --n-phases 3`.
        fix: >
          Label every frame with its CURRENT sub-task and use that as the instruction, keeping
          the episodes intact. Then make sure the label actually reaches the policy — see the
          next cause. Reweighting or rebalancing the dataset cannot fix an unidentifiable
          input; the conditional distribution is genuinely multivalued and a flow-matching
          head will regress to the mean of the modes, which the robot shows as stalling.
      - cause: "A dead proprioceptive state channel — the policy is effectively vision-only."
        rank: 3
        test: >
          Print per-dimension mean/std of `observation.state`; a constant or all-zero
          dimension is dead. Then ablate the state at inference: replace it with zeros and
          with another frame's state, and measure how far the predicted action chunk moves
          relative to the natural cross-observation variation.
          `python scripts/diag_policy.py --dataset <ds> --config <cfg> --test ablate`.
        fix: >
          pi0.5 feeds the state as discretised tokens into the VLM rather than as a continuous
          input, so dim order, scale and the q01/q99 statistics must match the checkpoint. Note
          that this behaviour is *derived*, not fixed: in openpi, `discrete_state_input`
          defaults to `None` and is resolved as `discrete_state_input = pi05`, so pi0.5 turns it
          on and pi0 turns it off — but `pi05_libero` explicitly sets it to `False` because
          LIBERO has no proprioceptive state. That means two people with identical robots can
          get different behaviour depending on which recipe they copied — read the flag out of
          the config rather than assuming, and check it when a recipe transfer does not behave
          as expected.
          If enough state dimensions are dead or mis-scaled, the tokens are constant and the
          phase becomes unobservable.
          The mechanism is concrete: the state is binned into 256 buckets over the
          normalised [-1, 1] range, so bad normalisation statistics make every dimension
          saturate at bin 0 or bin 255 — turning the state into a *constant string* that
          carries no information at all while still being present in the input.
        sources: ["https://github.com/Physical-Intelligence/openpi/blob/main/src/openpi/models/pi0_config.py"]
      - cause: "The action expert has collapsed to the unconditional mean action."
        rank: 4
        test: >
          Predict chunks for observations sampled across the whole episode. If the predictions
          barely differ between wildly different states, the conditioning is gone.
          `python scripts/diag_policy.py ... --test collapse`.
        fix: >
          Usually learning rate too high, too few steps for the frozen-VLM recipe, or action
          targets/normalisation wrong such that predicting the mean is the loss optimum.
          Check the chunk targets first: verify that `actions[t, k]` really is the action at
          frame `t+k` within the same episode, and that the flow-matching loss is masked on
          padded steps.
      - cause: "Idle frames at the head of every episode taught the policy to do nothing at the reset state."
        rank: 5
        test: "Compare the fraction of near-zero-action frames in the first ~10 frames of each episode against the rest of the episode."
        fix: >
          Drop or down-weight those frames and retrain. This is the cheapest fix in the whole
          document and it is frequently the answer — if the operator starts recording before
          touching the controller, every episode contributes a large, perfectly consistent
          'at this state, do not move' sample. This is not a heuristic: the openpi training
          recipe ships an idle filter as a default, filtering "any time steps for which the
          next chunk of actions would be largely idle". There is also industrial-scale
          evidence for the failure mode itself: the AgiBot World pipeline discovered excessive
          idle time and inconsistent transitions **only after deploying a trained policy**, not
          by auditing the data, and had to add a post-processing step to remove idle frames.
          If a 1M-trajectory industrial pipeline found this by deploying rather than by
          inspecting, inspecting your dataset by eye will not find it either.
        sources: ["https://github.com/Physical-Intelligence/openpi/blob/main/examples/droid/README_train.md",
                  "https://arxiv.org/abs/2503.06669"]
      - cause: "Episode-head frames dominate and the policy never sees the later phases from its own state distribution (covariate shift)."
        rank: 6
        test: >
          Open-loop check: put the robot or the recorded state back onto the expert trajectory,
          feed the expert observation, and see whether the predicted chunk reproduces the
          expert's continuation. If open loop is fine but closed loop stalls, the model is not
          the problem.
        fix: >
          Collect recovery and intermediate-start data: start the robot at the entrance state
          of every sub-task, including slightly off-expert states. This is the only thing that
          actually addresses compounding error.
      - cause: "Quantile normalisation computed on a small dataset has shrunk the effective action range, so the policy both trains on and emits scaled-down motion."
        rank: 7
        test: >
          Compare the q01/q99 spread of your actions against the range of motion your
          demonstrations actually contain, and check how much of the training data falls in the
          middle of the normalised range. Reported in openpi: pi0.5 fine-tuned with LoRA on the
          same single-arm data as pi0 performed substantially worse, with quantile normalisation
          on a small dataset named as a contributing cause.
        fix: >
          Note how this is wired: in openpi the flag is set as
          `use_quantile_norm=model_config.model_type != ModelType.PI0`, so quantile
          normalisation is hard-coded ON for pi0.5 and OFF for pi0 — you do not choose it, and
          the plot is easy to miss. The quantiles come from per-dimension running histograms
          (5,000 bins), so they are bin edges rather than exact percentiles, and the normalised
          values are **not clipped** — anything outside q01/q99 simply maps outside [-1, 1] and
          trains as-is.
          The reported fix for small fine-tunes is to disable it (`use_quantile_norm=False`,
          which requires patching the config), align batch size and learning rate with the
          shipped `pi05_libero` recipe rather than the pi0 defaults, and consider full
          fine-tuning or expert-only training rather than LoRA on both backbones.
          This cause is easy to miss because the loss looks healthy: the targets are scaled down
          consistently, so the model fits them well while emitting motion too small to do the
          task. It presents as hesitation or undershoot rather than as an obviously broken policy.
        sources: ["https://github.com/Physical-Intelligence/openpi/issues/763",
                  "https://github.com/Physical-Intelligence/openpi/issues/692",
                  "https://github.com/Physical-Intelligence/openpi/blob/main/src/openpi/training/config.py"]
    sources:
      - "https://mlanthology.org/corl/2025/jain2025corl-enabling/"
      - "https://arxiv.org/abs/2509.07953"
  - id: stalls-at-start
    symptom: "The robot hesitates or does not move at the beginning of a rollout, then behaves normally."
    severity: medium
    frequency: common
    causes:
      - cause: "Near-zero actions recorded at the start of each episode (recording started before teleoperation began)."
        rank: 1
        test: "Measure the mean action magnitude of the first N frames of each episode versus the episode median."
        fix: "Trim the head frames at dataset build time, or start recording only once motion begins. Also check the tail — operators often stop moving before stopping the recording."
      - cause: "Observation pipeline latency: the first inference runs on a stale or uninitialised observation."
        rank: 2
        test: "Log the timestamp of the observation that produced each action chunk and compare against the control-loop tick that consumed it."
        fix: "Prime the inference pipeline before enabling the controller, and discard the first chunk if its observation predates the start of the rollout."
  - id: stutter-and-stop
    symptom: "Motion is jerky, or the robot moves in short bursts with pauses between them."
    severity: high
    frequency: common
    causes:
      - cause: "Re-planning every control step while only the first few steps of each predicted chunk are trustworthy."
        rank: 1
        test: "Compare `n_action_steps = 1` against executing the full chunk (or a majority of it). Measure both smoothness and task success."
        fix: "Execute more of each chunk, use temporal ensembling to blend overlapping chunks, or adopt RTC for asynchronous execution. See `data/deployment.yaml`."
      - cause: "Inference latency exceeds the wall-clock duration of the chunk being executed."
        rank: 2
        test: "Measure end-to-end inference latency (observation in, chunk out) and compare it to `chunk_size / control_fps`."
        fix: "Either increase the chunk horizon, shorten inference (quantisation, distillation, smaller visual encoder), or decouple inference from control asynchronously."
      - cause: "Action space mismatch between training and deployment — absolute versus delta, or a different control frequency."
        rank: 3
        test: "Correlate `action[t]` against `state[t+1] - state[t]` versus `state[t+1]`. Whichever correlates more strongly indicates the convention your data was recorded in."
        fix: "Match the convention the checkpoint was trained with, and confirm the training frame rate equals the deployment control rate. A chunk horizon is defined in frames, so a frequency mismatch silently changes its physical duration."
  - id: chunk-tail-garbage
    symptom: "Only the first step or two of each predicted action chunk look correct; the rest is wrong."
    severity: high
    frequency: common
    causes:
      - cause: "Chunk targets are padded over the end of the episode and the loss is not masked there."
        rank: 1
        test: >
          Compute the mean valid fraction of each chunk target (frames near an episode end have
          partially invalid targets) and plot the loss as a function of chunk index k. If loss
          is low at k=0 and rises sharply, suspect the targets.
          `python scripts/diag_dataset.py <dataset> --chunk-size 50`.
        fix: >
          Mask the flow-matching loss on padded steps, and check what value the loader pads
          with. Repeating the last valid action is far less harmful than padding with zeros,
          which explicitly teaches 'stop moving' at the end of every chunk.
      - cause: "Genuine multimodality that the model is averaging along the horizon."
        rank: 2
        test: "Run the collapse test from the first symptom; if the k=0 action is also inflated or wrong, it is conditioning, not padding."
        fix: "Resolve the phase ambiguity first. Mode averaging is a symptom of an under-specified input, not a loss-function bug."
  - id: ignores-instruction
    symptom: "Changing the language instruction has no effect on behaviour."
    severity: high
    frequency: "common"
    causes:
      - cause: "The instruction never reaches the tokenizer — wrong key name or a prompt dropped in the observation transform."
        rank: 1
        test: "Ablate the prompt at inference (empty string, then a completely different instruction) and measure the change in predicted actions relative to the natural cross-observation variation."
        fix: "Fix the observation plumbing. Then verify that each training frame carries its own instruction rather than one global string for the whole episode."
      - cause: "One global instruction for a chained task, so the instruction cannot disambiguate phases even in principle."
        rank: 2
        test: "Check how many distinct instruction strings are in the dataset relative to the number of sub-tasks."
        fix: "Re-label per sub-task segment. This is the same root cause as the phase-aliasing symptom and the same fix."
      - cause: "Co-training or fine-tuning let the action expert drift away from the language-conditioned representation."
        rank: 3
        test: "Evaluate the fine-tuned policy on a paraphrased instruction set. If paraphrases fail but the exact training string works, the model has memorised the string rather than grounded it."
        fix: "Include instruction paraphrases in the fine-tuning data. See the pi0.5 knowledge-insulation approach if you are co-training on heterogeneous data."
  - id: fails-on-new-robot
    symptom: "The policy works on the robot it was trained on and fails completely on a different arm or gripper."
    severity: high
    frequency: common
    causes:
      - cause: "Normalisation statistics do not match the new embodiment — either the wrong ones are loaded, or the dataset's are missing."
        rank: 1
        test: >
          Two things to check. (a) openpi stores statistics alongside the checkpoint and lets
          you reload a per-embodiment set (`trossen`, `droid`, `franka`, `ur5e`, `arx`, ...)
          via `AssetsConfig`. Compare per-dimension q01/q99 of your actions and states against
          whichever set is being used. (b) For LeRobot datasets, check that
          `meta/stats.json` actually contains `q01` and `q99` — if it does not, training
          fails on the first batch with
          `ValueError: QUANTILES normalization mode requires q01 and q99 stats`.
        fix: >
          openpi's own guidance is to **try both** — reload the pretrained statistics and
          compute fresh ones — and keep whichever works better. Reloading can be *better* when
          your robot matches a pre-training embodiment, because the actions then land in a
          familiar range. The widely repeated advice to "always recompute" is stronger than
          what the model authors actually recommend. If you recompute, use
          `lerobot-edit-dataset --operation.type recompute_stats`, and note that recording
          aggregates quantiles from per-episode summaries into a conservative envelope
          (min for q <= 50, max for q > 50) rather than true dataset quantiles — which changes
          the normalised targets and therefore the loss scale.
        sources: ["https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md",
                  "https://huggingface.co/docs/lerobot/en/pi05"]
      - cause: "Action dimension or ordering differs, and the mismatch is being absorbed by padding."
        rank: 2
        test: "Print the raw action vector alongside the state vector for a few frames and check the joint ordering matches the URDF you are commanding."
        fix: "Fix the ordering explicitly and re-verify. Padded or permuted dimensions can train to a plausible-looking loss while producing physically wrong motion."
      - cause: "The gripper action polarity is inverted between model families, and nothing asserts it."
        rank: 3
        test: >
          Command a known gripper value and watch what the jaws do. In openpi the convention is
          `0 = open`, `1 = closed`; in OpenVLA it is the opposite, with a positive value meaning
          open. Both are verified in code, and neither framework asserts your convention at
          load time.
        fix: >
          Write the polarity down next to the action-space definition and assert it once at
          startup with a physical observation, not a code comment. The symptom is distinctive
          and easy to misread as a policy failure: the robot reaches the object correctly and
          then never grasps it, because it is closing the gripper when the policy meant to open.
        sources: ["https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md"]
      - cause: "Camera pose and intrinsics differ, so the visual conditioning is out of distribution."
        rank: 4
        test: "Hold the policy's view fixed and ablate the images; then compare the deployment camera pose against the recorded one."
        fix: "Match camera placement first — it is cheaper than retraining. If you cannot, collect a small amount of data on the new setup and fine-tune rather than expecting transfer."
  - id: sim-works-real-fails
    symptom: "Excellent success rate in simulation, poor on hardware."
    severity: high
    frequency: "very common"
    causes:
      - cause: "Covariate shift: the policy has never seen the states its own errors lead to."
        rank: 1
        test: "Open-loop teacher forcing on expert states. Good open-loop accuracy with bad closed-loop performance is the signature."
        fix: "Recovery data and intermediate-state initialisation, as in the first symptom. Also consider DAgger-style correction collection."
      - cause: "Simulation-only visual and dynamic fidelity gaps (lighting, textures, friction, compliance, latency)."
        rank: 2
        test: "Evaluate on randomised visual conditions in sim; if performance collapses, you are measuring a visual shortcut rather than a policy."
        fix: "Domain randomisation, and more importantly real data. Note that sim evaluation is a screening tool, not a proxy for deployment readiness."
      - cause: "No latency model: the deployment loop is slower than the training loop assumed."
        rank: 3
        test: "Measure the real observation-to-action latency and re-run the evaluation with that delay injected in sim."
        fix: "Fix the timing architecture (see the stutter symptom) rather than retraining."
  - id: eval-numbers-not-trustworthy
    symptom: "Success rate moves by 20 points between evaluation runs with no code change."
    severity: medium
    frequency: common
    causes:
      - cause: "Too few trials to distinguish the conditions."
        rank: 1
        test: "Compute a confidence interval on your current trial count. Twenty trials cannot resolve a ten-point difference."
        fix: "Pre-register the number of trials and the initial conditions. Randomise object poses across trials and report intervals, not point estimates."
      - cause: "Initial conditions are not controlled, so you are measuring the object placement distribution as much as the policy."
        rank: 2
        test: "Log the initial object pose per trial and check whether failures cluster in particular regions."
        fix: "Define a fixed, documented set of initial states and reuse it across every comparison. This also makes failures debuggable, because the same setup can be replayed."
      - cause: "Thermal or calibration drift over a long evaluation session."
        rank: 3
        test: "Run the same fixed condition at the start and end of the session and compare."
        fix: "Interleave conditions rather than running them in blocks, and re-check calibration between blocks."
  - id: config-did-not-apply
    symptom: "The policy behaves as if your configuration changes had no effect."
    severity: high
    frequency: "common"
    causes:
      - cause: "`pretrained_path` loads weights only — the checkpoint's stored config values silently fall back to defaults."
        rank: 1
        test: >
          Print the effective policy config after loading, not the one you passed. LeRobot
          documents this explicitly for pi0.5: `--policy.pretrained_path` loads weights only,
          so `lerobot/pi05_libero_base`, which stores both `n_action_steps` and
          `empty_cameras`, falls back to `50` and `0` unless you pass them explicitly.
        fix: >
          Pass the values explicitly rather than relying on them being restored from the
          checkpoint, and verify by printing the constructed policy. The same class of bug
          affects any framework that separates "load weights" from "load config".
        sources: ["https://huggingface.co/docs/lerobot/en/pi05"]
      - cause: "Normalisation mapping default differs between the base checkpoint and your recipe."
        rank: 2
        test: >
          Check which mapping is in effect. LeRobot's pi0.5 example passes
          `--policy.normalization_mapping='{\"ACTION\": \"MEAN_STD\", \"STATE\": \"MEAN_STD\", \"VISUAL\": \"IDENTITY\"}'`
          explicitly, because pi0.5's own default is quantile — and the reference checkpoint
          the results were measured on used mean/std.
        fix: "Match the mapping to the checkpoint you are comparing against, and state which one you used when reporting results. Two runs with different mappings are not comparable."
        sources: ["https://huggingface.co/docs/lerobot/en/pi05"]
      - cause: "A CLI argument was silently overridden by a namespaced default, so the value you passed never reached the optimizer or the trainer."
        rank: 3
        test: >
          Print the constructed config after argument parsing and compare it against what you
          passed on the command line. LeRobot has nested optimizer settings where the path
          matters — a bare `--optimizer.lr` can be shadowed by the policy-namespaced form, so
          the learning rate that actually trains is not the one on your command line. Related
          traps in the same family: the launcher matters (`accelerate` rather than `torchrun`),
          and distributed data parallel does **not** reduce per-GPU memory the way people
          assume it does — it replicates the model, so it speeds up training without making the
          model fit.
        fix: >
          Treat the parsed config, not your command line, as the ground truth, and print it once
          at the start of every run. This is the same discipline as reading
          `num_learnable_params` instead of trusting your PEFT flags: in this ecosystem, the
          configuration you intended and the configuration that ran are frequently different,
          and nothing errors when they are.
        notes: >
          Exact flag names move between versions. Verify against the docs for your pinned
          revision rather than copying a flag from a tutorial — including from this repo.
      - cause: "Statistics cached inside an existing checkpoint override newly computed dataset statistics."
        rank: 4
        test: "Recompute the dataset statistics and check whether the loaded checkpoint's stored statistics changed."
        fix: >
          They will not — LeRobot states that statistics already saved inside an existing
          checkpoint are not affected by recomputing dataset stats. Start from a checkpoint
          without embedded statistics, or expect the stored ones to win.
        sources: ["https://huggingface.co/docs/lerobot/en/pi05"]
  - id: normalization-silently-skipped
    symptom: "Training runs and loss decreases, but the policy behaves as if the data were never normalized — or normalization appears to do nothing at all."
    severity: high
    frequency: "common"
    causes:
      - cause: "Normalization is silently skipped because the statistics keys do not match, and the code returns the tensor unchanged instead of raising."
        rank: 1
        test: >
          Check which statistics keys the checkpoint actually carries. Multi-dataset checkpoints
          store them under dataset-prefixed keys such as `so100.buffer.action.mean`, while the
          lookup uses the bare key `action`. The processor's guard is
          `if norm_mode == IDENTITY or key not in self._tensor_stats: return tensor` — a silent
          return, not an error. A minimal check: load the policy, feed a fake action, and test
          whether the unnormalized output differs from the input.
        fix: >
          Do not assume normalization is happening because the pipeline contains a normalization
          step. Verify numerically on one batch — compare `unnormalize(normalize(a))` against `a`
          and assert the round trip. Reported on `lerobot/smolvla_base`, where normalization and
          unnormalization are both skipped, and independently confirmed by a third party.
        sources: ["https://github.com/huggingface/lerobot/issues/4415"]
      - cause: "Quantiles were aggregated across merged datasets by averaging per-source quantiles, which is mathematically invalid."
        rank: 2
        test: >
          Count what fraction of your training values fall outside the saved `q01`/`q99`. If it
          is far above the expected ~2%, the statistics are wrong. This has been measured on a
          published dataset: on `lerobot/droid_1.0.1`, the shipped action `q01`/`q99` leave
          between 12.18% and 79.03% of action values outside the per-dimension range, against
          roughly 2% for exact full-data bounds. On a merged dataset, 41.65% of state joint 1
          and 42.12% of action joint 1 values fell outside the saved quantiles while `mean`
          differed by only 1e-7.
        fix: >
          Recompute quantiles over all frames rather than merging summaries. A repair tool
          exists for the DROID case. The reason this matters more than it sounds: everything
          outside `q01`/`q99` maps outside `[-1, 1]` after normalization, so for pi0.5 a large
          fraction of normal training samples have normalized targets outside the expected
          range — which changes the loss scale rather than producing an obvious error.
        sources: ["https://github.com/huggingface/lerobot/issues/4156",
                  "https://github.com/sawhney17/droid-quantile-repair",
                  "https://github.com/huggingface/lerobot/pull/4172"]
      - cause: "The statistic key does not match the live camera or feature name, so a required entry is missing."
        rank: 3
        test: >
          Look for an assertion mentioning `infinity` at evaluation time. The legacy buffers are
          initialised to `+inf` precisely so that a missing statistic is loud — but only if the
          key is looked up at all.
        fix: >
          Make the camera names in your robot config match the feature names in the dataset's
          `meta/stats.json` exactly. This is the canonical mismatch: the data was recorded with
          one set of camera keys and the robot is configured with another.
        sources: ["https://github.com/huggingface/lerobot/issues/1095"]
      - cause: "A pipeline migration mangled a feature name containing an underscore."
        rank: 4
        test: "Print the feature keys the policy declares and compare them against the keys present in the statistics."
        fix: >
          An unconditional `replace(\"_\", \".\")` during normalization-statistics extraction
          turns `observation.environment_state` into `observation.environment.state`, which is
          then never found. The policy's declared feature keys must be treated as authoritative
          rather than re-derived from the string.
        sources: ["https://github.com/huggingface/lerobot/issues/4451"]
    notes: >
      The general lesson: in this stack, a missing or mismatched statistic frequently produces a
      silent no-op rather than an exception. Assert the round trip `unnormalize(normalize(a)) == a`
      once per experiment and you will catch this entire class of bug in one line.
  - id: fine-tune-zero-success
    symptom: "Fine-tuning runs to completion and the loss decreases normally, but success rate is at or near zero."
    severity: high
    frequency: "common"
    causes:
      - cause: "The PEFT target-module list excludes the vision tower and language backbone, so almost nothing task-relevant is being trained."
        rank: 1
        test: >
          Read `num_learnable_params` out of the training log rather than trusting the CLI flags
          you passed. In a controlled SmolVLA / SO-101 experiment using the default target list,
          only 742,656 parameters were trainable (0.16 %) and **every mid-training evaluation
          scored 0.0 %**, while full fine-tuning was already at 60 % on its first evaluation.
        fix: >
          Expand the target list rather than abandoning LoRA. Adding three q/v families and fully
          training the five embodiment projection layers (rank 64, lr 3e-4) reached 94.0 / 84.0 /
          98.0 % with 9,851,728 trainable parameters (2.1 %) — about 1/40 of full fine-tuning's
          parameters at matched task performance. Match the trainable *fraction*, not the rank:
          the same rank 64 is 2.1 % of SmolVLA but roughly 0.58 % of pi0, because the models have
          very different numbers of attention sites.
        sources: ["https://github.com/Xbotics-Embodied-AI-club/Xbotics-Embodied-AI-Handbook/blob/main/docs/part3-end-to-end/12-VLA%E5%BE%AE%E8%B0%83%E5%AE%9E%E6%88%98.md",
                  "https://huggingface.co/docs/lerobot/en/smolvla"]
      - cause: "An adapter flag silently changed the meaning of the model path, so you trained an adapter on top of an adapter — or read a base model as one."
        rank: 2
        test: "Check whether the loaded base model is the one you expect. In LeRobot, setting `--policy.use_peft=true` makes the framework interpret `--policy.path` as an already-trained adapter directory."
        fix: "Use `--peft.method_type` / `--peft.r` to attach a new adapter to a clean base, and verify the base checkpoint that actually got loaded."
        sources: ["https://github.com/Xbotics-Embodied-AI-club/Xbotics-Embodied-AI-Handbook/blob/main/docs/part3-end-to-end/12-VLA%E5%BE%AE%E8%B0%83%E5%AE%9E%E6%88%98.md"]
      - cause: "Config drift: several settings differ from the reference recipe at once, and the combination is not the one that was validated."
        rank: 3
        test: "Diff your training config against the shipped reference config field by field, not by remembering which flags you passed."
        fix: >
          Use the shipped config verbatim first and confirm it reproduces the published number,
          then change exactly one thing at a time. This is the documented resolution of a
          reported pi0.5-at-1%-on-LIBERO case, where the drift was LoRA plus
          `discrete_state_input=False` plus a non-standard horizon plus hand-computed statistics
          that differed from the checkpoint's, plus ad-hoc learning-rate changes.
        sources: ["https://github.com/Physical-Intelligence/openpi/issues/711"]
  - id: training-collapses-unexpectedly
    symptom: "Training collapses, produces NaNs, or the loss is orders of magnitude wrong — with no obvious change to the data."
    severity: high
    frequency: "common"
    causes:
      - cause: "The pretrained weights silently failed to load, because a dependency bump renamed the checkpoint keys."
        rank: 1
        test: >
          Compare the loss at step 0 against the loss you expect from a loaded pretrained model.
          A jump from around 0.5 to around 4.5 is the reported signature of pretrained weights
          not loading at all — you are training from scratch and the only clue is the loss scale.
        fix: >
          Pin the `transformers` version, or verify explicitly after loading that the weights are
          present and non-random. Do not rely on the loader to raise: the reported failure was
          silent. This is the general lesson for every framework in this space — assert that the
          checkpoint loaded rather than assuming it did.
        sources: ["https://github.com/huggingface/lerobot/issues/1406"]
      - cause: "Action standard deviation is zero or near-zero, so the normalised targets explode."
        rank: 2
        test: "Print per-dimension action std for your dataset before training. A zero or denormal value here produces a loss in the millions rather than a plausible-looking one."
        fix: >
          Add a small epsilon to the denominator. Suggested range from community reports is
          roughly 2e-5 to 2e-4 — large enough to avoid the explosion, small enough not to
          distort well-conditioned dimensions.
        sources: ["https://github.com/Physical-Intelligence/openpi/issues/814"]
        notes: >
          The epsilon value is from secondary field notes rather than from the issue body
          itself. Treat the range as a starting point and confirm on your own data.
      - cause: "Model compilation silently produces NaN through a miscompiled mask."
        rank: 3
        test: "If NaNs appear only with compilation enabled, disable it and rerun the same config."
        fix: >
          Turn compilation off to confirm, then either pin the compiler version or leave it off.
          The point is not that compilation is broken — it is that enabling it changes numerics,
          so it belongs in the diff when you bisect a NaN.
        sources: ["https://github.com/huggingface/lerobot/issues/4178"]
      - cause: "A resumed PEFT run silently discarded the adapters."
        rank: 4
        test: "After resuming, check the trainable parameter count again — it should match the run you resumed from."
        fix: >
          Re-verify the adapter state after every resume rather than assuming the framework
          restored it. Resuming is exactly where silent state loss hides, because the loss curve
          continues smoothly whether or not the adapters came back.
        sources: ["https://github.com/huggingface/lerobot/issues/3459"]
