section: "Landscape — what already exists"
order: 10
description: >
  Read this before adding anything. Most of the VLA space is already curated; this repo
  only exists because one specific slice is not. Linking to these instead of duplicating
  them is the difference between a useful list and noise.

  Star counts and last-commit dates are a 2026-09 snapshot.
entries:
  - id: keon-awesome-physical-ai
    name: "keon/awesome-physical-ai"
    url: "https://github.com/keon/awesome-physical-ai"
    type: list
    what: >
      433 stars. The only curated list in this space with a literal `## Deployment`
      section (Quantization & Compression, Real-Time Control) plus `## Safety & Alignment`.
    why: >
      DO NOT USE. It is the single most likely trap for a reader looking for deployment
      material.
    maturity: abandoned
    verified: 2026-09
    license: unknown
    tags: [trap, do-not-cite]
    notes: >
      Verified on 2026-09-29: the Deployment and Safety sections contain 27 fabricated
      placeholder arXiv IDs of the form `2505.XXXXX` / `2512.XXXXX`, attached to real-looking
      names (BitVLA, QuaRT-VLA, RTC, ASIMOV, RoboGuard). `grep -c XXXXX` on this file returns
      27; the same grep across 32 other READMEs in this space returns 0. The content reads as
      LLM-generated. Last commit 2026-06-24. Kept here, dated and labelled, because a reader
      will find it and needs to know.
  - id: vla-handbook
    name: "sou350121/VLA-Handbook"
    url: "https://github.com/sou350121/VLA-Handbook"
    type: list
    what: >
      662 stars, Chinese, updated daily by a cron pipeline. ~525 theory docs plus a
      deployment/ tree: hardware selection *with pricing*, ROS2 zero-copy/DDS tuning, edge
      deployment (GPTQ/AWQ, TensorRT-LLM, vLLM), agentic VLA layering with latency budgets,
      camera calibration, multimodal sync, UR5 ur_rtde realtime kernel, GELLO teleop, pi0
      deployment, dexterous-hand CANFD/EtherCAT, sim2real.
    why: >
      This is the closest thing to an existing occupant of our niche, and it proves the niche
      is real. It is 100% Chinese, which is exactly why an English-first equivalent is worth
      building. Read it if you read Chinese; it is strictly ahead of us on hardware specifics.
      Our differentiation is English reach, verified provenance, and measured numbers.
    maturity: production
    verified: 2026-09
    license: unknown
    tags: [competitor, chinese, handbook, deployment]
    notes: >
      Also distils 300+ Xiaohongshu posts, 165 English blogs, 135 LeRobot Discord threads and
      200+ GitHub issues, including a GPU compatibility matrix (RTX50/Jetson), pi0 fine-tune
      traps, GR00T VRAM requirements, and convergence-failure root causes.
