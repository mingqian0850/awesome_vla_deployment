  - id: awesome-physical-ai-natnew
    name: "natnew/awesome-physical-ai"
    url: "https://github.com/natnew/awesome-physical-ai"
    type: list
    what: >
      151 stars. `## Production Patterns / Reference Architectures` (ROS2, Isaac ROS, MoveIt2,
      Nav2, Open-RMF, DDS-Security, Foxglove, micro-ROS, ros2_control, Cyclone/FastDDS, MCAP,
      Zenoh, rosbag2), `## Safety & Robustness` (safe-RL, control barrier functions, RSS,
      formal verification), `## Governance` (ISO 10218, ISO/TS 15066, ISO 26262, UL 4600,
      EU AI Act), plus courses and hardware platforms.
    why: >
      The strongest governance/standards coverage anywhere. But it never connects any of it to
      a running VLA inference loop: 0 TensorRT/ONNX/quantization, 0 e-stop/watchdog, 0 subtask,
      0 data cleaning. That gap is our section 43.
    maturity: production
    verified: 2026-09
    tags: [middleware, standards, ros2]
