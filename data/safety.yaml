section: Runtime monitoring and protection
section_zh: 运行监测与防护
order: 80
description: Monitoring methods and engineering references; research monitors are not safety certification.
description_zh: 监测方法与工程资料；研究监测器不等于安全认证。
entries:
- id: dguv-ifa-cobot
  name: DGUV/IFA — collaborative robot safety (readable interpretation)
  url: https://www.dguv.de/ifa/fachinfos/kollaborierende-roboter/index-2.jsp
  type: standard
  maturity: production
  verified: 2026-09
  tags:
  - standards
  - iso-ts-15066
  - iso-10218
  - cobot
  - readable
  what: DGUV/IFA information on collaborative-robot hazards and protective measures; applicability depends
    on the system and task.
  what_zh: DGUV/IFA 关于协作机器人危险与防护措施的资料；适用性取决于具体系统和任务。
- id: iso-21448-sotif
  name: ISO 21448 — Safety of the Intended Functionality (SOTIF)
  url: https://www.bsigroup.com/en-GB/standards/iso-21448/
  type: standard
  maturity: production
  verified: 2026-09
  tags:
  - standards
  - sotif
  - odd
  - safety-case
  - learned-components
  what: SOTIF is a road-vehicle standard on hazards from functional insufficiency; it is conceptual background,
    not a general robot certification rule.
  what_zh: SOTIF 是针对道路车辆功能不足风险的标准；在此作为概念背景，不是通用机器人认证规则。
  notes: Scope is road vehicles; do not present this reference as a required standard for every robot.
  notes_zh: 适用范围为道路车辆，不应将该资料表述为所有机器人的必需标准。
- id: hide-and-seek-trajectories
  name: 'Hide-and-Seek in Trajectories: Discovering Failure Signals for VLA Runtime Monitoring'
  url: https://arxiv.org/abs/2605.30834
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - monitoring
  - failure-detection
  - runtime
  - trajectories
  what: Studies failure signals in policy trajectories for runtime monitoring.
  what_zh: 研究策略轨迹中可用于运行时监测的失败信号。
- id: safecast
  name: 'SAFECAST: Robust Failure Detection for VLA Policies'
  url: https://arxiv.org/abs/2608.04246
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - monitoring
  - failure-detection
  - calibration
  - distribution-shift
  what: Studies calibrated failure detection under visual and instruction distribution shifts.
  what_zh: 研究视觉和指令分布变化下经过校准的失败检测。
- id: rafail
  name: 'RAFAIL: Relationship-Aware Failure Detection for Robotic Manipulation'
  url: https://arxiv.org/abs/2609.18324
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - monitoring
  - failure-detection
  - latency
  - gpu-contention
  - semantic
  what: Combines relational semantic checks with faster out-of-distribution signals for manipulation failure
    detection.
  what_zh: 结合关系语义检查与较快的分布外信号，检测操作失败。
- id: rewind-il
  name: 'Rewind-IL: Online Failure Detection and State Respawning for Imitation Learning'
