  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - monitoring
  - recovery
  - respawning
  - long-horizon
  - chunking
  what: Combines online failure detection with state respawning in imitation-learning tasks.
  what_zh: 在模仿学习任务中结合在线失败检测与状态重置。
- id: nvidia-halos
