section: Deployment and runtime
section_zh: 部署与运行
order: 40
description: Connect policy inference to observation and robot control.
description_zh: 连接策略推理、观测与机器人控制。
entries:
- id: eapn-execution-aligned-replanning
  name: EAPN — execution-aligned asynchronous replanning
  paper_title: Execution-Aligned Progressive Noise for Consistent Asynchronous Replanning in Generative
    Robot Policies
  url: https://arxiv.org/abs/2610.06090
  type: paper
  maturity: research
  verified: 2026-10
  tags:
  - async
  - chunking
  - continuity
  - latency
  what: Aligns correlated noise and committed actions across replanning steps to improve action-chunk
    continuation.
  what_zh: 在重规划之间对齐相关噪声与已承诺动作，改善动作块的连续性。
  notes: Preprint; the implementation and hardware results have not been reproduced in this repository.
  notes_zh: 预印本；本仓库未复现其实现与硬件结果。
- id: rephrase-before-you-act
  name: Rephrase Before You Act — instruction normalization for a frozen VLA
  paper_title: 'Rephrase Before You Act: Characterizing and Mitigating Language Sensitivity in Vision-Language-Action
    Models'
  url: https://arxiv.org/abs/2610.10526
  type: paper
  maturity: research
  verified: 2026-10
  tags:
  - language
  - robustness
  - instructions
  - evaluation
  sources:
  - https://sttawm.github.io/rephrase-before-you-act/
  - https://github.com/sttawm/phrase-rl
  what: Distills instruction-rephrasing rules from training-task evaluations and rewrites input instructions
    for a frozen policy.
  what_zh: 根据训练任务评测归纳指令改写规则，再为冻结的策略改写输入指令。
  notes: Evaluate whether rewriting preserves user intent. Linked code artifacts were inspected, but reuse
    licensing and end-to-end reproduction remain unverified.
  notes_zh: 需评测改写是否保留用户意图。已查看所链接代码资料，但复用许可与端到端复现仍未验证。
- id: ogam-runtime-monitor
  name: OGAM — object-grounded attention monitoring
  paper_title: 'OGAM: Connecting Systematic Testing to Runtime Assurance through Object-Grounded Attention
    Monitoring for VLA Policies'
  url: https://arxiv.org/abs/2610.05878
  type: paper
  maturity: research
  verified: 2026-10
  tags:
  - monitoring
  - attention
  - runtime
  - evaluation
  what: Compares object-grounded attention against successful reference episodes to trigger early stopping;
    requires attention access and calibration data.
  what_zh: 将对象级注意力与成功参考轨迹比较以触发提前停止；需要访问注意力及校准数据。
  notes: Needs object masks and successful reference/calibration episodes. Reported stopping performance
    is protocol-specific, not a general safety guarantee.
  notes_zh: 需要对象掩码和成功参考、校准轨迹。停止性能只对应论文实验协议，不是通用安全保证。
- id: lerobot-rtc-modes
  name: LeRobot — guided vs trained RTC and checkpoint delay limits
  url: https://github.com/huggingface/lerobot/blob/main/docs/source/rtc.mdx
  type: docs
  maturity: research
  verified: 2026-10
  license: Apache-2.0
  tags:
  - rtc
  - chunking
  - checkpoint
  - latency
  - compatibility
  what: Documents guided RTC and trained prefix conditioning. Trained mode requires a compatible checkpoint
    trained with a positive maximum delay.
  what_zh: 说明 guided RTC 与训练式前缀条件输入；trained 模式要求兼容且训练最大延迟为正的检查点。
  notes: For trained mode, execution_horizon and inference.queue_threshold must cover the checkpoint maximum
    training delay; the execution horizon must not exceed chunk_size minus that delay. Pin code and documentation
    together.
  notes_zh: trained 模式下，execution_horizon 与 inference.queue_threshold 必须覆盖检查点的最大训练延迟；执行步数不得超过 chunk_size
    减去该延迟。代码与文档需固定为匹配版本。
