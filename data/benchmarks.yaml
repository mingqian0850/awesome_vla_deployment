section: "Deployment benchmarks — measured, not cited"
order: 45
description: >
  Entries with `type: gap` are deliberate: they mark measurements that no public source
  publishes, in a structured place where a contributor can fill them in. Writing down that a
  number does not exist is more useful than writing down a number that might not be true.

  The protocol for producing each of these is in docs/40-optimization-matrix.md.
entries:
  - id: vram-requirements
    name: "VRAM and hardware requirements (published)"
    url: "https://github.com/Physical-Intelligence/openpi"
    type: docs
    what: >
      The one part of this matrix that IS published: openpi's README states inference > 8 GB,
      LoRA fine-tuning > 22.5 GB (both RTX 4090), full fine-tuning > 70 GB (A100 80GB / H100),
      with multi-GPU via `fsdp_devices` supported and multi-node unsupported.
    why: >
      Settles the hardware question for the training side. It does not answer the deployment
      question, which is what the `gap` entries below are about.
    maturity: production
    verified: 2026-09
    tags: [vram, hardware, published]
  - id: gap-latency
    name: "GAP — end-to-end inference latency per model per hardware"
    url: "https://github.com/mingqian0850/awesome_vla_deployment/issues"
    type: gap
    what: >
      Not published anywhere found. What is missing: observation-captured to chunk-returned
      latency, at p50/p95/p99, for pi0.5 / pi0 / GR00T N1.5 / OpenVLA / RDT-1B on Jetson Orin,
      Jetson Thor, RTX 4090 and A100.
    why: >
      This single table would resolve more real deployments than any paper in this repo. The
      feasibility arithmetic in docs/41-real-time-inference.md needs exactly two numbers —
      `L` and `D_c` — and only one of them is easy to find. Without `L` you cannot tell
      whether your control rate is achievable until you have the hardware in hand.
    maturity: toy
    verified: 2026-09
    tags: [gap, latency, wanted, benchmark]
    notes: >
      To contribute: report p50/p95/p99 (not the mean), the exact batch size and action horizon,
      the denoising step count, the dtype, and whether the timing includes camera capture and
      image preprocessing. Timings that exclude preprocessing are the most common source of
      disagreement between reports.
  - id: gap-quantization
    name: "GAP — what quantization does to task success rate"
    url: "https://github.com/mingqian0850/awesome_vla_deployment/issues"
    type: gap
    what: >
      Not published anywhere found. Missing: success rate before and after INT8 / FP8 / INT4 /
      GPTQ / AWQ, per model, with the latency gained and the trial count.
    why: >
      Quantization papers report perplexity and latency, which are proxies. For a policy, the
      only number that matters is whether the task still succeeds. Negative results are
      especially valuable here: "INT8 broke this policy because the action head's outputs are
      small-magnitude deltas and quantisation noise dominated them" is a finding that would
      save several teams a week each.
    maturity: toy
    verified: 2026-09
    tags: [gap, quantization, wanted, benchmark]
  - id: gap-export
    name: "GAP — which models actually export to ONNX / TensorRT / OpenVINO"
    url: "https://github.com/mingqian0850/awesome_vla_deployment/issues"
    type: gap
    what: >
      Not published anywhere found. Missing: a per-model yes/no on whether a working export
      exists, which operator or dynamic-shape construct blocked it, and what the exported
      graph's latency was.
    why: >
      Existing "efficient VLA" sections in other lists are paper tables, so a reader cannot
      tell whether an export path exists for their model or whether it is a research proposal.
      A table of attempted exports — including the failures and the specific blocker — is
      immediately actionable.
    maturity: toy
    verified: 2026-09
    tags: [gap, onnx, tensorrt, openvino, wanted]
  - id: gap-rtc-comparison
    name: "GAP — sync vs temporal ensembling vs RTC on the same task"
    url: "https://github.com/mingqian0850/awesome_vla_deployment/issues"
    type: gap
    what: >
      Not published anywhere found. Missing: success rate and motion smoothness for the three
      execution strategies on one task, one checkpoint and one robot, with the inference
      latency reported.
    why: >
      The three strategies are universally discussed and never compared under controlled
      conditions. Without this, choosing between them is guesswork, and the choice is usually
      made by whichever one the codebase happens to implement.
    maturity: toy
    verified: 2026-09
    tags: [gap, rtc, ensembling, wanted, benchmark]
  - id: gap-safety-overhead
    name: "GAP — what the safety layer costs"
    url: "https://github.com/mingqian0850/awesome_vla_deployment/issues"
    type: gap
    what: >
      Not published anywhere found. Missing: the added latency and the achievable control rate
      once an independent limiter, heartbeat and stale-observation guard are in the loop.
    why: >
      Teams skip the safety layer partly because nobody has quantified its cost. If the honest
      answer is "0.3 ms and 2% of a core", that removes the main practical objection to
      building it — and the layer in docs/43-safety.md is the most valuable unclaimed part of
      this whole field.
    maturity: toy
    verified: 2026-09
    tags: [gap, safety, latency, wanted]
