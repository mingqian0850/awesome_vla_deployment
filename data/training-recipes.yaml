section: "Training recipes — the numbers"
order: 35
description: >
  Every figure here is quoted from a primary source that was fetched and read, not recalled.
  Where the field does not publish a number, the field says so — a documented gap is a
  finding, and inventing a plausible figure would defeat the purpose of this repo.

  The honest summary: hardware requirements and hyperparameters ARE published; comparative
  success-rate numbers for LoRA vs full fine-tune vs frozen backbone are NOT. That second
  column is the most valuable empty space in this document.
entries:
  - id: openpi-requirements
    name: "openpi — GPU / VRAM requirements"
    url: "https://github.com/Physical-Intelligence/openpi"
    type: docs
    what: >
      Quoted from the openpi README requirements table (single GPU, no model parallelism):
      Inference > 8 GB (RTX 4090); Fine-Tuning with LoRA > 22.5 GB (RTX 4090);
      Fine-Tuning full > 70 GB (A100 80GB / H100). Multi-GPU is supported via `fsdp_devices`
      in the training config to reduce per-GPU memory; multi-node is not supported.
    why: >
      The most concrete public answer to "what hardware do I need" for pi0 / pi0.5. The
      practical decision it settles for most teams: LoRA fits on a single 24 GB consumer card,
      full fine-tuning does not — and the repo does not tell you what the success-rate
      difference is, which is exactly the number you need to make that call.
    maturity: production
    verified: 2026-09
    tags: [vram, hardware, pi0, pi05, recipe]
    notes: "Quoted verbatim from the README section 'Requirements'."
  - id: openpi-norm-stats
    name: "openpi — normalisation statistics and when to reuse them"
    url: "https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md"
    type: docs
    what: >
      First-party documentation of normalisation statistics: they are computed over the
      training data and stored alongside the checkpoint, and can be reloaded for a new
      fine-tune via `AssetsConfig(assets_dir=..., asset_id=...)`. Pre-training statistics are
      provided per embodiment — `trossen` (ALOHA), `trossen_mobile`, `droid`, `franka`,
      `ur5e`, `ur5e_dual`, `arx`, `arx_mobile`, `fibocom_mobile`.
    why: >
      This is the document that decides whether your fine-tune converges. It also corrects a
      widespread piece of advice: openpi does NOT say "always recompute the statistics".
      It says to **try both** reloading the pretrained statistics and computing fresh ones,
      and keep whichever works better — reloading can be *better* when your robot matches a
      pre-training embodiment, because the actions then land in a range the model finds
      familiar.
    maturity: production
    verified: 2026-09
    tags: [normalization, q01, q99, statistics, gotcha]
    notes: >
      Reusing pre-training statistics only works if your action space follows the same
      convention. See the action-space entry below before assuming it applies to you.
  - id: openpi-action-space
    name: "openpi — action space and control frequency conventions"
    url: "https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md"
    type: docs
    what: >
      dim_0:dim_5 = left arm joint angles (radians), dim_6 = left gripper, dim_7:dim_12 = right
      arm joints, dim_13 = right gripper, dim_14:dim_15 = x-y base velocity (mobile only).
      7-DoF robots such as Franka use the first 7 dimensions for joints and the 8th for the
      gripper. Gripper positions are in [0.0, 1.0] with 0.0 fully open and 1.0 fully closed.
      Control frequency is 20 Hz for UR5e and Franka, 50 Hz for ARX and Trossen (ALOHA).
    why: >
      The single highest-yield thing to check when porting a policy to a new arm. Two traps
      hide here: the gripper convention is inverted relative to many drivers (0 = open, not
      closed), and a control-frequency mismatch silently changes the physical duration of a
      fixed-length action chunk.
    maturity: production
    verified: 2026-09
    tags: [action-space, gripper, control-frequency, porting]
  - id: droid-action-space
    name: "DROID action space is joint VELOCITY, not position"
    url: "https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md"
    type: docs
    what: >
      "For DROID, we use the original DROID action configuration, with joint velocity actions
      in the first 7 dimensions and gripper actions in the 8th dimension + a control frequency
      of 15 Hz."
    why: >
      A concrete instance of the general delta/absolute/velocity confusion, documented by the
      model authors. If you fine-tune on DROID data and deploy on a position-controlled arm —
      or the reverse — the policy will produce motion that is wrong in a way that looks like a
      bad model rather than a unit mismatch.
    maturity: production
    verified: 2026-09
    tags: [action-space, velocity, droid, gotcha]
  - id: lerobot-pi05-recipe
    name: "LeRobot — pi0.5 fine-tuning recipe"
    url: "https://huggingface.co/docs/lerobot/en/pi05"
    type: docs
    what: >
      Reference command, sized for a single 80 GB GPU: `--batch_size=64`, `--steps=30000`,
      `--policy.n_action_steps=10`, `--policy.gradient_checkpointing=true`,
      `--policy.dtype=bfloat16`, `--num_workers=8`, `--save_freq=5000`. A second variant sets
      `--policy.freeze_vision_encoder=true --policy.train_expert_only=true`.
    why: >
      The most directly copyable pi0.5 recipe that exists. The docs state the tradeoff for the
      frozen variant explicitly — "less memory, at some cost in success rate" — which is
      unusually honest, and is the only public statement of that tradeoff I found.
    maturity: production
    verified: 2026-09
    tags: [recipe, pi05, hyperparameters, frozen-vlm]
  - id: lerobot-pi0-recipe
    name: "LeRobot — pi0 fine-tuning recipe"
    url: "https://huggingface.co/docs/lerobot/en/pi0"
    type: docs
    what: >
      Reference command: `--batch_size=32`, `--steps=3000`, `--policy.compile_model=true`,
      `--policy.gradient_checkpointing=true`, `--policy.dtype=bfloat16`.
    why: >
      Note the step count — 3000, an order of magnitude below the pi0.5 recipe's 30000. If you
      copy a step count between these two models you will either under-train or waste days.
    maturity: production
    verified: 2026-09
    tags: [recipe, pi0, hyperparameters]
  - id: openpi-idle-filter
    name: "openpi — idle filter for DROID training"
    url: "https://github.com/Physical-Intelligence/openpi/blob/main/examples/droid/README_train.md"
    type: docs
    what: >
      "By default, our openpi training recipe implements the same idle filter used to train all
      pi-DROID models... we filter any time steps for which the next chunk of actions would be
      largely idle." Implemented by pre-computing dataset indices
      (`compute_droid_nonidle_ranges.py`) and passing `filter_dict_path` in the training config.
    why: >
      First-party confirmation that idle filtering is not a superstition — the model authors
      built it into the default recipe. This is the strongest available evidence for the
      episode-head idle hypothesis in the troubleshooting section, where a policy learns "at
      the reset state, do not move".
    maturity: production
    verified: 2026-09
    tags: [idle, filtering, sampling, droid]
    notes: >
      The published index list is only valid for the `droid/1.0.1` dataset. For your own data,
      rerun the script — or compute the equivalent in `scripts/diag_dataset.py`, which reports
      episode-head idle contamination directly.
  - id: rtc-training
    name: "Training-Time Action Conditioning for Efficient Real-Time Chunking"
    url: "https://arxiv.org/abs/2512.05964"
    type: paper
    what: >
      Trains the policy to accept an action prefix as conditioning, so that asynchronous
      execution joins smoothly instead of jumping. Exposed in LeRobot as
      `policy.rtc_training_max_delay`, set to the largest expected inference delay in
      controller steps.
    why: >
      The difference between inference-time RTC, which patches over the chunk-boundary
      discontinuity, and training-time conditioning, which removes it. If you know your
      deployment latency at training time, this is the more principled fix.
    maturity: research
    verified: 2026-09
    tags: [rtc, async, training, latency]
  - id: openvla-ft-comparison
    name: "Full FT vs LoRA vs frozen vs last-layer, with numbers"
    url: "https://arxiv.org/abs/2406.09246"
    type: benchmark
    what: >
      The one rigorous controlled comparison found, from the OpenVLA paper (Table 1), 33 rollouts
      per strategy on Franka-Tabletop. Success rate / trainable parameters / VRAM at batch 16:
      full fine-tune 69.7 ± 7.2 % / 7,188 M / 163 GB; LoRA rank 32 68.2 ± 7.5 % / 97.6 M (1.4 %) /
      59.7 GB; LoRA rank 64 68.2 ± 7.8 % / 195 M / 60.5 GB; sandwich (vision encoder +
      embeddings + last layer) 62.1 ± 7.9 % / 914 M / 64.0 GB; frozen vision encoder
      47.0 ± 6.9 % / 6,760 M / 156 GB; last layer only 30.3 ± 6.1 % / 465 M / 51.4 GB.
    why: >
      Two conclusions that change how you configure a fine-tune. First, LoRA applied to all
      linear layers matches full fine-tuning at 1.4 % of the parameters and roughly a third of
      the memory — LoRA is not the problem people blame it for. Second, and more important:
      **which modules you update dominates how many.** Freezing the vision encoder costs about
      22 points and training only the last layer costs about 39. If you are choosing between
      LoRA configurations, choose by which modules are in the target list, not by rank.
    maturity: research
    verified: 2026-09
    tags: [lora, full-finetune, comparison, success-rate, benchmark, frozen-vision]
    notes: >
      The error bars overlap between full FT and LoRA rank 32, which is the honest reading: at
      33 trials you cannot distinguish them. Both being ~68-70 % while frozen-vision is 47 %
      is the signal.
  - id: lerobot-lora-target-trap
    name: "LeRobot's default LoRA target list is the trap, not LoRA"
    url: "https://github.com/huggingface/lerobot/issues/4415"
    type: discussion
    what: >
      LeRobot's default PEFT config targets only q/v projections inside the expert plus a handful
      of projection layers, and sets `modules_to_save` to an empty list — the vision tower and
      the language backbone are not in the target list. In a controlled SmolVLA / SO-101
      experiment on an identical 3698-episode dataset, the default targets trained 742,656
      parameters (0.16 %) and **every mid-training evaluation scored 0.0 %**, while full SFT was
      already at 60 % on its first evaluation. Expanding the target list (three q/v families plus
      fully training the five embodiment projections, rank 64, lr 3e-4) reached 94.0 / 84.0 /
      98.0 % with 9,851,728 trainable parameters (2.1 %) — roughly 1/40 of full SFT's parameters
      at matched task performance.
    why: >
      This is the highest-value practical finding in the training section, and it is a trap that
      looks like a data problem. A fine-tune that sits at 0 % success while the loss decreases
      normally is the signature, and the cause is a parameter budget you never chose
      deliberately. It also corrects a widespread misconception: the quantity to match across
      models is the trainable *fraction*, not the rank — the same rank 64 is 2.1 % of SmolVLA but
      roughly 0.58 % of pi0, because the two models have very different numbers of attention
      sites.
    maturity: research
    verified: 2026-09
    tags: [lora, peft, target-modules, zero-success, trap, smolvla]
    notes: >
      Two command-surface details from the same source. Use `--peft.method_type` / `--peft.r` to
      attach a new adapter to a clean base; setting `--policy.use_peft=true` instead makes the
      framework treat `--policy.path` as an already-trained adapter directory, so pointing it at
      a base model reads a base model as an adapter. And the acceptance test is to read
      `num_learnable_params` out of the training log rather than trusting your CLI flags —
      without `--policy.freeze_vision_encoder=false --policy.train_expert_only=false`, SmolVLA
      reports about 100 M trainable instead of about 403 M.
  - id: pi05-small-dataset-quantile
    name: "pi0.5 fine-tunes worse than pi0 on small single-arm datasets"
    url: "https://github.com/Physical-Intelligence/openpi/issues/763"
    type: discussion
    what: >
      Reported case: pi0.5 fine-tuned with LoRA on the same single-arm data as pi0 performed
      substantially worse (150k versus 80k steps, 4x A100 40 GB). Suspected contributors:
      quantile normalisation computed on a small dataset shrinking the effective action range;
      pi0.5's discretised state plus differing AdamW/EMA configuration; and LoRA applied to both
      backbones freezing too much. The reported fix was to disable quantile normalisation for
      small fine-tunes (`use_quantile_norm=False`), align batch size and learning rate with the
      `pi05_libero` recipe rather than the pi0 defaults, and consider full fine-tuning or
      expert-only training instead of LoRA everywhere.
    why: >
      Directly relevant to the most common real symptom in this repo — a policy that produces
      small or hesitant motion. If quantile normalisation on a small dataset compresses the
      action range, then both the training targets and the decoded outputs are scaled down, and
      the robot moves less than it should while the loss looks healthy. Check this before
      concluding that your data is bad.
    maturity: research
    verified: 2026-09
    tags: [pi05, loRA, quantile, normalization, small-dataset, action-range]
    sources: ["https://github.com/Physical-Intelligence/openpi/issues/763",
              "https://github.com/Physical-Intelligence/openpi/issues/692"]
  - id: pi05-config-drift
    name: "pi0.5 at 1% on LIBERO: config drift, not the model"
    url: "https://github.com/Physical-Intelligence/openpi/issues/711"
    type: discussion
    what: >
      Reported case of pi0.5 scoring about 1 % on LIBERO against a much higher paper number. The
      diagnosis was configuration drift: LoRA, `discrete_state_input=False`, a non-standard
      action horizon, and hand-computed statistics that differed from the checkpoint's — plus
      ad-hoc learning-rate modifications.
    why: >
      The recommended remedy generalises to every fine-tune in this space: use the shipped config
      verbatim first, confirm it reproduces, then change exactly one thing at a time. And diff
      your own `TrainConfig` field by field against the reference config rather than assuming
      your CLI flags produced the config you intended.
    maturity: research
    verified: 2026-09
    tags: [pi05, config-drift, libero, debugging]
  - id: checkpoint-selection
    name: "How people actually decide a fine-tune is done"
    url: "https://github.com/Physical-Intelligence/openpi"
    type: discussion
    what: >
      Collected protocols, each read from its own source rather than recalled: OpenVLA-OFT uses
      an L1 action error threshold of about 0.01 with a plateau, evaluating every 50k steps —
      with the reported exception that on LIBERO-Goal, 50k steps beat 150k. GR00T reports
      open-loop MSE falling 87.5 → 25.4 → 13.2 → 10.0 at 500 / 1000 / 1500 / 2000 steps with no
      published target MSE. RDT-1B tracks `overall_avg_sample_mse`. LeRobot guidance is 5-10
      epochs. openpi recipes use fixed step budgets.
    why: >
      Nobody publishes a criterion, only conventions — and the LIBERO-Goal exception matters
      because it means "train longer" is not reliably better. The useful move is to write your
      own stopping rule down before you start, because the alternative is choosing the checkpoint
      whose number you liked, which is how a fine-tune's reported success rate becomes
      unreproducible.
    maturity: research
    verified: 2026-09
    tags: [checkpoint, stopping-rule, training-length, protocol]
  - id: evaluation-noise-floor
    name: "Run-to-run noise floors you should measure before comparing anything"
    url: "https://github.com/NVIDIA/Isaac-GR00T"
    type: discussion
    what: >
      Reported noise levels: GR00T shows roughly 5-6% run-to-run variation, and about ±5%
      sampling noise at 100 episodes.
    why: >
      A five-point noise floor means a five-point improvement is not a result. Measure your own
      floor by running the identical configuration twice before you compare two configurations —
      it is one of the cheapest experiments available and it prevents most of the false
      conclusions in this space.
    maturity: research
    verified: 2026-09
    tags: [evaluation, noise, reproducibility, statistics]
