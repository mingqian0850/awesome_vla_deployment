section: Fine-tuning and configuration
section_zh: 微调与配置
order: 30
description: Action representations, statistics, adapters and checkpoint handling.
description_zh: 动作表示、统计量、适配器与检查点处理。
entries:
- id: openpi-requirements
  name: openpi — GPU / VRAM requirements
  url: https://github.com/Physical-Intelligence/openpi
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - vram
  - hardware
  - pi0
  - pi05
  - recipe
  what: openpi documents GPU memory requirements for inference, LoRA and full fine-tuning; practical use
    also depends on configuration and overhead.
  what_zh: openpi 记录推理、LoRA 与全量微调的显存要求；实际占用还受配置和额外开销影响。
  notes: The recorded single-GPU table gives >8 GB for inference, >22.5 GB for LoRA and >70 GB for full
    fine-tuning. Check the source revision and leave room for data, optimizer and saving overhead.
  notes_zh: 历史单 GPU 表给出推理 >8 GB、LoRA >22.5 GB、全量微调 >70 GB。需核对来源版本，并为数据、优化器和保存操作预留空间。
- id: openpi-norm-stats
  name: openpi — normalisation statistics and when to reuse them
  url: https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - normalization
  - q01
  - q99
  - statistics
  - gotcha
  what: Normalization statistics are stored with checkpoints; matching embodiment statistics can be reused
    or compared against newly computed statistics.
  what_zh: 归一化统计量与检查点一起保存；可复用匹配机器人形态的统计量，并与重新计算的结果对比。
- id: openpi-action-space
  name: openpi — action space and control frequency conventions
  url: https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - action-space
  - gripper
  - control-frequency
  - porting
  what: Documents robot-specific joint ordering, gripper conventions and control frequencies; read the
    configuration for the actual embodiment.
  what_zh: 记录不同机器人的关节顺序、夹爪约定和控制频率；需要读取实际机器人形态的配置。
- id: droid-action-space
  name: DROID — action representation
  url: https://github.com/Physical-Intelligence/openpi/blob/main/docs/norm_stats.md
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - action-space
  - velocity
  - droid
  - gotcha
  what: DROID uses seven joint-velocity actions plus a gripper action at 15 Hz in the cited openpi configuration.
  what_zh: 所引用的 openpi 配置中，DROID 使用七维关节速度加一维夹爪动作，控制频率为 15 Hz。
- id: lerobot-pi05-recipe
  name: LeRobot — pi0.5 fine-tuning recipe
  url: https://huggingface.co/docs/lerobot/en/pi05
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - recipe
  - pi05
  - hyperparameters
  - frozen-vlm
  what: Reference pi0.5 fine-tuning configuration covering batch size, steps, precision, checkpointing
    and expert-only variants.
  what_zh: pi0.5 微调参考配置，包含 batch size、步数、精度、梯度检查点及仅训练专家的变体。
- id: lerobot-pi0-recipe
  name: LeRobot — pi0 fine-tuning recipe
  url: https://huggingface.co/docs/lerobot/en/pi0
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - recipe
  - pi0
  - hyperparameters
  what: Reference pi0 fine-tuning configuration with compilation, gradient checkpointing and BF16 settings.
  what_zh: pi0 微调参考配置，包含编译、梯度检查点和 BF16 设置。
- id: openpi-idle-filter
  name: openpi — idle filter for DROID training
  url: https://github.com/Physical-Intelligence/openpi/blob/main/examples/droid/README_train.md
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - idle
  - filtering
  - sampling
  - droid
  what: DROID training recipe filters timesteps whose subsequent action chunks are largely idle.
  what_zh: DROID 训练配方过滤后续动作块大部分为空闲动作的时间步。
- id: rtc-training
  name: Training-Time Action Conditioning for Efficient Real-Time Chunking
  url: https://arxiv.org/abs/2512.05964
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - rtc
  - async
  - training
  - latency
  what: Trains action-prefix conditioning for RTC; maximum expected inference delay is expressed in controller
    steps.
  what_zh: 为 RTC 训练动作前缀条件输入；最大预期推理延迟以控制步数表示。
- id: openvla-ft-comparison
  name: OpenVLA — fine-tuning strategy comparison
  url: https://arxiv.org/abs/2406.09246
  type: benchmark
  maturity: research
  verified: 2026-09
  tags:
  - lora
  - full-finetune
  - comparison
  - success-rate
  - benchmark
  - frozen-vision
  what: OpenVLA compares full fine-tuning, LoRA and partial freezing under a shared evaluation protocol,
    including memory and trainable parameters.
  what_zh: OpenVLA 在同一评测协议下比较全量微调、LoRA 与部分冻结，并报告显存和可训练参数量。
- id: lerobot-lora-target-trap
  name: SmolVLA — LoRA target modules
  url: https://github.com/huggingface/lerobot/issues/4415
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - lora
  - peft
  - target-modules
  - zero-success
  - trap
  - smolvla
  what: A SmolVLA experiment reports that LoRA target-module coverage changed rollout success substantially;
    rank alone does not define the adapter.
  what_zh: 一项 SmolVLA 实验报告 LoRA 目标模块的覆盖范围显著影响执行成功率；仅设置 rank 不能完整定义适配器。
- id: pi05-small-dataset-quantile
  name: pi0.5 fine-tunes worse than pi0 on small single-arm datasets
  url: https://github.com/Physical-Intelligence/openpi/issues/763
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - pi05
  - loRA
  - quantile
  - normalization
  - small-dataset
  - action-range
  sources:
  - https://github.com/Physical-Intelligence/openpi/issues/763
  - https://github.com/Physical-Intelligence/openpi/issues/692
  what: A reported small-data pi0.5 regression involves normalization and training settings; the suggested
    changes require controlled comparison.
  what_zh: 一例小数据 pi0.5 性能退化涉及归一化与训练设置；建议修改仍需通过受控对比验证。
- id: pi05-config-drift
  name: pi0.5 — configuration-drift report
  url: https://github.com/Physical-Intelligence/openpi/issues/711
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - pi05
  - config-drift
  - libero
  - debugging
  what: A low LIBERO result was associated with differences in adapters, state input, horizons and statistics
    from the reference configuration.
  what_zh: 一例 LIBERO 低成功率与适配器、状态输入、动作步数和统计量偏离参考配置有关。
- id: checkpoint-selection
  name: Checkpoint evaluation protocols
  url: https://github.com/Physical-Intelligence/openpi
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - checkpoint
  - stopping-rule
  - training-length
  - protocol
  what: Examples of checkpoint selection using validation errors, fixed budgets and rollout evaluation;
    metrics are not interchangeable across frameworks.
  what_zh: 使用验证误差、固定预算和 rollout 评测选择检查点的实例；不同框架的指标不能直接互换。
- id: evaluation-noise-floor
  name: Evaluation variability
  url: https://github.com/NVIDIA/Isaac-GR00T
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - evaluation
  - noise
  - reproducibility
  - statistics
  what: Reported evaluation variation illustrates the need to measure run-to-run and finite-sample uncertainty
    on the actual setup.
  what_zh: 已报告的评测波动说明，需要在实际配置上测量运行间差异及有限样本不确定性。
- id: horizon-ablations
  name: SmolVLA — prediction and execution horizons
  url: https://arxiv.org/abs/2506.01844
  type: benchmark
  maturity: research
  verified: 2026-09
  tags:
  - horizon
  - chunking
  - execution-depth
  - ablation
  - benchmark
  - rtc
  what: SmolVLA separately studies prediction horizon and executed steps; these are distinct parameters
    with task-dependent effects.
  what_zh: SmolVLA 分别研究预测步数与实际执行步数；它们是不同参数，影响取决于任务。
- id: normalization-three-regimes
  name: Normalization modes
  url: https://arxiv.org/abs/2506.01844
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - normalization
  - mean-std
  - z-score
  - quantile
  - pi0
  - pi05
  - smolvla
  what: Model families and recipes use different normalization modes; inspect the constructed configuration
    rather than inferring it from the model name.
  what_zh: 不同模型与配方使用不同归一化方式；应检查最终配置，不能只凭模型名称推断。
- id: fsq-tokenizer-trap
  name: openpi — FSQ and FAST tokenizers
  url: https://github.com/Physical-Intelligence/openpi
  type: repo
  maturity: production
  verified: 2026-09
  tags:
  - tokenizer
  - fast
  - fsq
  - vqbet
  - disambiguation
  - trap
  what: openpi's fsq_tokenizer.py serves RoboArena baselines. FAST is a distinct DCT/BPE action tokenizer
    used by FAST model variants.
  what_zh: openpi 的 fsq_tokenizer.py 用于 RoboArena 基线；FAST 是另一种基于 DCT/BPE 的动作 tokenizer，用于 FAST 模型变体。
- id: lerobot-relative-action-floor
  name: LeRobot relative-action support has a version floor
  url: https://github.com/huggingface/lerobot/pull/2970
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - versioning
  - relative-actions
  - flag
  - gotcha
  what: 'Relative-action processors and flags require a compatible LeRobot revision; the recorded implementation
    arrived through PR #2970.'
  what_zh: '相对动作处理器与参数需要兼容的 LeRobot 版本；记录中的实现由 PR #2970 引入。'
- id: vram-boundary-counterevidence
  name: LoRA — practical memory limits
  url: https://github.com/Physical-Intelligence/openpi/issues/379
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - vram
  - hardware
  - lora
  - oom
  - ddp
  - multi-gpu
  what: User reports show a nominal LoRA memory requirement can still exceed a 24 GB GPU in specific configurations.
  what_zh: 用户报告显示，在特定配置下，满足名义 LoRA 显存要求的 24 GB GPU 仍可能溢出。
- id: fine-tune-cost-anchor
  name: Fine-tuning cost example
  url: https://docs.picknik.ai/how_to/vla/train_a_vla_policy/
  type: blog
  maturity: production
  verified: 2026-09
  tags:
  - cost
  - budget
  - lora
  - planning
  what: A documented fine-tuning run provides a historical cost example; billing depends on provider,
    hardware, duration and current rates.
  what_zh: 一项微调记录提供历史成本示例；实际账单取决于服务商、硬件、时长和当前价格。
- id: multi-gpu-not-auto-scaled
  name: Distributed training configuration
  url: https://github.com/huggingface/lerobot/blob/main/docs/source/multi_gpu_training.mdx
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - multi-gpu
  - learning-rate
  - batch-size
  - reproducibility
  what: Distributed training does not automatically rescale learning rate or step count; DDP normally
    replicates model state per device.
  what_zh: 分布式训练不会自动调整学习率或步数；DDP 通常在每张设备上复制模型状态。
- id: demos-is-the-wrong-unit
  name: Demonstration volume and coverage
  url: https://github.com/huggingface/lerobot/blob/main/docs/source/il_robots.mdx
  type: docs
  maturity: research
  verified: 2026-09
  tags:
  - data-volume
  - episode-length
  - demos
  - planning
  - units
  what: Record episode count together with duration, control frequency and task coverage; equal episode
    counts can represent different amounts of data.
  what_zh: 同时记录 episode 数量、时长、控制频率与任务覆盖；相同 episode 数量可能对应不同数据量。
- id: aalto-execution-horizon
  name: Execution-horizon paired comparison
  url: https://aaltodoc.aalto.fi/items/711175d6-6d75-4751-af72-b055bd8cd4db/full
  type: benchmark
  maturity: research
  verified: 2026-09
  tags:
  - execution-horizon
  - chunking
  - significance
  - offline-selection
  - benchmark
  what: A paired-trial study compares execution horizons; its optimum is specific to the tested checkpoints
    and tasks.
  what_zh: 一项配对试验研究比较不同执行步数；最佳值仅对应所测检查点与任务。
- id: openvla-demo-replay
  name: OpenVLA — LIBERO demonstration replay
  url: https://arxiv.org/abs/2406.09246
  type: paper
  maturity: production
  verified: 2026-09
  tags:
  - data-quality
  - replay-check
  - libero
  - benchmark
  - prior
  what: OpenVLA authors replayed LIBERO demonstrations and removed episodes that did not satisfy the task
    success criterion.
  what_zh: OpenVLA 作者回放 LIBERO 示教，并剔除不满足任务成功标准的 episode。
- id: checkpoint-write-oom
  name: Checkpoint-saving memory failure
  url: https://github.com/moojink/openvla-oft/issues/118
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - oom
  - checkpointing
  - memory
  - late-failure
  what: A training run can run out of memory during checkpoint saving even when ordinary training steps
    fit.
  what_zh: 正常训练步的显存足够时，保存检查点仍可能发生显存溢出。
