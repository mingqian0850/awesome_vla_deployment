section: Reported failure cases
section_zh: 已报告的失败案例
order: 70
description: Observed limitations in particular tasks and configurations.
description_zh: 特定任务与配置中观测到的限制。
entries:
- id: language-grounding-gap
  name: Language-grounding interventions
  paper_title: 'Encoded but Not in Control: Revealing the Grounding Gap in Vision-Language Robot Policies'
  url: https://arxiv.org/abs/2610.06235
  type: paper
  maturity: research
  verified: 2026-10
  tags:
  - language
  - grounding
  - evaluation
  - target-selection
  what: Changing a valid target instruction while holding the scene fixed can reveal a policy that follows
    scene correlations rather than the requested target.
  what_zh: 固定场景、改变合法的目标指令，可以发现策略是否依赖场景关联而没有服从目标变化。
  notes: Findings apply to the tested policies and protocol; the source reports both simulation and real-robot
    experiments.
  notes_zh: 结论适用于所测策略与实验协议；来源包含仿真和真机实验。
- id: oft-hardware-drift
  name: OpenVLA-OFT — hardware drift report
  url: https://openvla-oft.github.io/
  type: blog
  maturity: production
  verified: 2026-09
  tags:
  - drift
  - calibration
  - non-reproducibility
  - camera-pose
  - wear
  what: OpenVLA-OFT authors report degradation after wrist-camera pose changes and joint wear, despite
    unchanged code and training data.
  what_zh: OpenVLA-OFT 作者报告：代码和训练数据不变，腕部相机位置变化与关节磨损仍会导致性能下降。
- id: picknik-loss-curve
  name: PickNik — training loss and rollout evaluation
  url: https://docs.picknik.ai/how_to/vla/train_a_vla_policy/
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - loss
  - evaluation
  - overfitting
  - validation
  - pitfall
  what: A training runbook explains that low demonstration loss without held-out evaluation does not establish
    closed-loop task success.
  what_zh: 训练手册指出：没有独立评测时，示教损失较低不能证明闭环任务成功。
- id: oft-more-data-did-not-fix-it
  name: OpenVLA-OFT — language-grounding data experiment
  url: https://openvla-oft.github.io/
  type: blog
  maturity: production
  verified: 2026-09
  tags:
  - negative-result
  - language-grounding
  - data-scaling
  - film
  what: In a reported OpenVLA-OFT task, doubling or quadrupling demonstrations did not resolve language
    grounding; conditioning changes were also needed.
  what_zh: 在 OpenVLA-OFT 的一个任务中，示教数量增加到两倍或四倍仍未解决语言接地问题，还需要调整条件输入机制。
- id: lerobot-25-episodes-failed
  name: SmolVLA — demonstration-count comparison
  url: https://github.com/huggingface/lerobot/blob/main/docs/source/smolvla.mdx
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - episode-count
  - data-size
  - negative-result
  - smolvla
  what: SmolVLA documentation reports poor performance with 25 episodes in a cube task and a better result
    with 50; this is a task-specific comparison.
  what_zh: SmolVLA 文档报告一个方块任务中 25 条示教表现较差、50 条更好；该结论来自特定任务。
- id: lerobot-50-is-a-floor
  name: LeRobot — demonstration coverage guidance
  url: https://github.com/huggingface/lerobot/issues/2378
  type: discussion
  maturity: production
  verified: 2026-09
  tags:
  - episode-count
  - data-size
  - planning
  - pi05
  what: LeRobot guidance discusses starting with about 50 demonstrations for a fixed-location task and
    increasing coverage as objects or positions vary.
  what_zh: LeRobot 建议固定位置任务可从约 50 条示教起步；物体或位置变化后，应增加覆盖范围。
- id: pi0-authors-hedge
  name: openpi — embodiment-transfer limitations
  url: https://github.com/Physical-Intelligence/openpi
  type: docs
  maturity: production
  verified: 2026-09
  tags:
  - non-transfer
  - expectations
  - pi0
  what: openpi documents embodiment differences between its training robots and other platforms; successful
    transfer is not guaranteed.
  what_zh: openpi 说明训练机器人与其他平台存在形态差异，迁移成功并无保证。
- id: oft-copies-bad-demos
  name: OpenVLA-OFT — demonstration-quality report
  url: https://openvla-oft.github.io/
  type: blog
  maturity: production
  verified: 2026-09
  tags:
  - negative-result
  - data-quality
  - imitation
  - demonstrations
  what: A reported scooping experiment shows a learned policy reproducing excessive insertion depth present
    in suboptimal demonstrations.
  what_zh: 一项舀取实验显示，策略会重复低质量示教中过深插入的动作。
- id: sim-benchmarks-hid-the-problem
  name: OpenVLA — Franka deployment case study
  url: https://openaccess.thecvf.com/content/CVPR2026W/MEIS/html/Liu_Bridging_the_Pretrain-to-Real_Gap_Alignment_Challenges_in_Deploying_Generalist_VLA_CVPRW_2026_paper.html
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - sim-to-real
  - benchmark-critique
  - openvla
  - franka
  what: A real Franka Research 3 deployment of OpenVLA required decoding, gripper-threshold and geometric
    adaptations beyond simulation evaluation.
  what_zh: 将 OpenVLA 部署到真实 Franka Research 3 时，除仿真评测外，还需处理解码、夹爪阈值和几何适配。
- id: openvla-100-demos
  name: OpenVLA — fine-tuning data guidance
  url: https://github.com/openvla/openvla/issues/12
  type: discussion
  maturity: research
  verified: 2026-09
  tags:
  - episode-count
  - action-token-accuracy
  - openvla
  - metrics
  what: OpenVLA authors describe approximately 100 demonstrations for a fine-tuning setup; token accuracy
    remains separate from rollout success.
  what_zh: OpenVLA 作者描述了一种约 100 条示教的微调配置；动作 token 准确率与实际任务成功率仍需分开测量。
- id: smolvla-pretraining-payoff
  name: SmolVLA — pretraining comparison
  url: https://arxiv.org/abs/2506.01844
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - pretraining
  - smolvla
  - success-rate
  - benchmark
  what: The SmolVLA paper reports higher SO100 task success after community-data pretraining under its
    experimental protocol.
  what_zh: SmolVLA 论文在其 SO100 实验协议下报告，使用社区数据预训练后任务成功率提高。
- id: position-beats-velocity
  name: Diffusion Policy — position and velocity control
  url: https://arxiv.org/abs/2303.04137
  type: paper
  maturity: production
  verified: 2026-09
  tags:
  - action-space
  - position
  - velocity
  - latency
  - negative-result
  - counter-evidence
  what: Diffusion Policy reports position control outperforming velocity control in its tested tasks,
    with different sensitivity to latency.
  what_zh: Diffusion Policy 在所测任务中报告位置控制优于速度控制，两者对延迟的敏感程度不同。
