  - id: aloha
    name: "ALOHA / Mobile ALOHA"
    url: "https://github.com/MarkFzp/mobile-aloha"
    type: repo
    what: "Low-cost bimanual teleoperation and imitation learning platform; the origin of the widely copied leader-follower collection rig."
    why: "The reference architecture for bimanual data collection. Cheap, replicable, and the hardware design has been reimplemented by many labs."
    maturity: research
    verified: 2026-09
    tags: [teleoperation, bimanual, hardware]
  - id: umi
    name: "Universal Manipulation Interface (UMI)"
    url: "https://github.com/real-stanford/universal_manipulation_interface"
    type: repo
    what: "Hand-held gripper with a camera that collects manipulation demonstrations in the wild, without a robot present; policy is deployed on a robot later."
    why: "Decouples data volume from robot availability — the main practical bottleneck in collection. Its in-the-wild capture also gives the visual diversity that fixes overfitting to one table setup."
    maturity: research
    verified: 2026-09
    tags: [teleoperation, robot-free, hardware]
  - id: open-television
    name: "Open-TeleVision"
    url: "https://github.com/OpenTeleVision/TeleVision"
    type: repo
    what: "VR-based immersive teleoperation with stereo streaming and active vision, for bimanual and humanoid platforms."
    why: "Faster and more natural collection than leader-follower arms, and it records head/vision motion which is otherwise impossible to demonstrate."
    maturity: research
    verified: 2026-09
    tags: [teleoperation, vr]
  - id: robot-teach
    name: "robot_teach (Open-Teach)"
    url: "https://github.com/chiawenwang/robot_teach"
    type: repo
    what: "One-shot physical teaching: a single human demonstration from VR hand tracking produces a reusable policy."
    why: "Interesting for data efficiency — worth knowing when the question is 'how few demonstrations can I get away with', which is most people's real constraint."
    maturity: research
    verified: 2026-09
    tags: [teleoperation, one-shot, vr]
  - id: robomimic
    name: "robomimic"
    url: "https://github.com/ARISE-Initiative/robomimic"
    type: repo
    what: "Framework for offline imitation learning from demonstration, with standard datasets, and the reference implementation of the 'What Matters in Learning from Offline Human Demonstrations' study."
    why: "The most rigorous public evidence on which data-quality factors actually move success rate. Read it before assuming more data is the answer — number of demonstrations, operator quality and diversity often matter more than volume."
    maturity: production
    verified: 2026-09
    license: MIT
    tags: [imitation-learning, data-quality, study]
  - id: robosuite
    name: "robosuite"
    url: "https://github.com/ARISE-Initiative/robosuite"
    type: repo
    what: "Modular simulation framework for robot manipulation, the sim backend behind robomimic."
    why: "Useful for pre-flight checks and for generating targeted recovery data before spending robot time."
    maturity: production
    verified: 2026-09
    tags: [simulation]
  - id: mimicgen
    name: "MimicGen"
    url: "https://github.com/NVlabs/MimicGen"
    type: repo
    what: "Generates large-scale demonstration datasets from a small number of human demonstrations by transforming object poses and replanning."
    why: "The most credible way to multiply scarce human demonstrations. Note the caveat that generated data inherits the failure modes of the source trajectories — it will not fix bad teleoperation."
    maturity: research
    verified: 2026-09
    tags: [data-generation, simulation]
  - id: open-x-embodiment
    name: "Open X-Embodiment"
    url: "https://robotics-transformer-x.github.io/"
    type: dataset
    what: "Aggregated cross-embodiment robot manipulation dataset spanning many robots and labs, in RLDS format."
    why: "The standard co-training corpus. Mostly useful as regularisation against overfitting a small in-house dataset, not as a task-specific training set."
    maturity: production
    verified: 2026-09
    tags: [dataset, cross-embodiment]
  - id: open-x-embodiment-repo
    name: "google-deepmind/open_x_embodiment"
    url: "https://github.com/google-deepmind/open_x_embodiment"
    type: repo
    what: "Code and per-dataset documentation for loading Open X-Embodiment."
    why: "The practical entry point — the project page alone will not get the data into your training loop."
    maturity: production
    verified: 2026-09
    tags: [dataset, rlds, tooling]
  - id: data-curation-paper
    name: "Robot Data Curation"
    url: "https://arxiv.org/abs/2502.08623"
    type: paper
    what: "Studies how to curate robot demonstration data, including a practical demonstration-influence-style filtering approach."
    why: "Gives you a defensible answer to 'should I throw away these episodes' instead of guessing."
    maturity: research
    verified: 2026-09
    tags: [data-quality, filtering, paper]
  - id: curating-online-experience
    name: "Curating Demonstrations using Online Experience"
    url: "https://arxiv.org/abs/2503.03707"
    type: paper
    what: "Uses online interaction experience to select which demonstrations are worth training on."
    why: "Data selection driven by what the policy actually gets wrong, which is usually a much better signal than any offline heuristics."
    maturity: research
    verified: 2026-09
    tags: [data-quality, selection, paper]
  - id: subgoal-transitions
    name: "Enabling Long(er) Horizon Imitation for Manipulation Tasks by Modeling Subgoal Transitions"
    url: "https://mlanthology.org/corl/2025/jain2025corl-enabling/"
    type: paper
    what: "Models transitions between subgoals to extend the effective horizon of imitation-learned manipulation policies."
    why: "Directly addresses the failure where a chained policy executes the first sub-task and then stalls — which is the single most reported symptom in this space."
    maturity: research
    verified: 2026-09
    tags: [long-horizon, subgoal, paper]
  - id: rac-recovery
    name: "RaC: Robot Learning for Long-Horizon Tasks by Scaling Recovery and Correction"
    url: "https://arxiv.org/abs/2509.07953"
    type: paper
    what: "Scales up recovery and correction data to make long-horizon policies robust to their own errors."
    why: "The clearest statement of the thing practitioners learn the hard way: long-horizon failures are usually covariate shift, and the fix is recovery data — not more demonstrations of the happy path."
    maturity: research
    verified: 2026-09
    tags: [long-horizon, recovery, paper]
  - id: action-only-scorers-fail
    name: "Action-Only Scorers Fail on the Structural Defects That Degrade Imitation Policies"
    url: "https://arxiv.org/abs/2606.05588"
    type: paper
    what: >
      An empirical audit of demonstration-curation metrics, showing that scoring approaches
      based on the actions alone miss the structural defects that actually degrade imitation —
      non-Markovian structure, idleness, and spurious correlations.
    why: >
      The academic confirmation of the argument this repo makes about dataset balance: **do not
      curate or reweight by action value.** If your quality signal is computed from the action
      distribution, it is provably blind to the defects that matter. Pair an action-based scorer
      with a structural one, or you will filter out good episodes and keep bad ones — and the
      metrics will look like they are working the whole time.
    maturity: research
    verified: 2026-09
    tags: [data-quality, curation, metrics, structural-defects, negative-result]
  - id: balanced-bc-imbalanced
    name: "Towards Balanced Behavior Cloning from Imbalanced Datasets"
    url: "https://arxiv.org/abs/2508.06319"
    type: paper
    what: "Studies behaviour cloning on demonstration datasets with unequal numbers of demonstrations across behaviours and skills, and what rebalancing does to the learned policy."
    why: >
      The right level at which to think about balance. Imbalance matters at the
      behaviour/skill/sub-task level, not the action-value level, and this quantifies how much
      an over-represented behaviour distorts the policy. Read it before deciding your dataset
      is imbalanced and reaching for resampling.
    maturity: research
    verified: 2026-09
    tags: [balance, imbalance, behaviour-cloning, mixture, sub-task]
  - id: openvla-mixture-recipe
    name: "OpenVLA's data balancing and mixture recipe over Open X-Embodiment"
    url: "https://arxiv.org/abs/2406.09246"
    type: paper
    what: >
      Documents an explicit mixture recipe over Open X-Embodiment: reweighting to balance robot
      platform, task and scene distributions, removing dominant single-dataset biases, and
      stating exclusion criteria for unusable datasets.
    why: >
      The most concrete published account of how to build a VLA training mixture. Note what it
      balances — platform, task, scene — and what it does not: the marginal action histogram.
      That is the answer to "how do I make my data distribution even", from the people who
      trained one of the most widely used open VLAs.
    maturity: research
    verified: 2026-09
    tags: [mixture, balance, open-x-embodiment, recipe, openvla]
  - id: agibot-world-pipeline
    name: "AgiBot World — the 3-phase collection pipeline, and how the idle-frame defect was found"
    url: "https://arxiv.org/abs/2503.06669"
    type: paper
    what: >
      1M+ trajectories across 217 tasks with a standardised collection pipeline: pilot collection
      to validate feasibility and fix collection standards; skilled teleoperators collecting with
      local validity verification before upload; then cloud post-processing where annotators
      verify each episode against the phase-1 standards and add language annotation. A
      human-in-the-loop cycle then collects a small set, trains a policy, deploys it, and uses
      policy failures to find data defects.
    why: >
      Two findings worth more than the dataset. First, **the excessive-idle-time defect was
      discovered by deploying a trained policy, not by inspecting the data** — industrial-scale
      confirmation that idle frames are a real failure cause and that auditing a dataset
      without a policy in the loop does not reliably find them. Second, it is a worked example
      of the deploy-find-defect-fix-collect flywheel, which is the operational shape every
      serious data effort eventually takes.
    maturity: production
    verified: 2026-09
    tags: [pipeline, idle-frames, deployment-flywheel, annotation, industrial]
  - id: eventual-dead-frames
    name: "Cutting dead frames from DROID — 500 hours of robot data in 32 seconds"
    url: "https://www.eventual.ai/blog/cutting-dead-frames-from-droid"
    type: blog
    what: "Engineering write-up on detecting and trimming idle frames across the whole DROID corpus at speed."
    why: >
      A concrete, reproducible idleness pass at real scale. Useful as a design reference when
      your dataset is too large to inspect episode by episode, which is the situation where
      nobody bothers to trim at all.
    maturity: production
    verified: 2026-09
    tags: [idle-frames, trimming, scale, engineering]
  - id: daft-motion-trimming
    name: "Daft — motion trimming for physical AI"
    url: "https://docs.getdaft.io/en/stable/examples/motion-trimming-physical-ai/"
    type: tool
    what: "A runnable example notebook for motion trimming of robot video data."
    why: "Copy-paste starting point for building your own dead-frame trimming pass rather than writing the plumbing from scratch."
    maturity: production
    verified: 2026-09
    tags: [idle-frames, trimming, tool, recipe]
  - id: lerobot-doctor
    name: "lerobot-doctor — dataset quality diagnostics"
    url: "https://github.com/jashshah999/lerobot-doctor"
    type: tool
    what: "Community diagnostics tool for LeRobot datasets: idle time, anomalies, per-episode outliers."
    why: >
      Overlaps deliberately with our own `scripts/diag_dataset.py` — and you should know that,
      because choosing between them is better than running neither. This one is a packaged
      quality report; ours adds the phase-aliasing test, the chunk-target validity check and
      the action-convention probe, which are the diagnostics specific to the chained-task
      failure this repo is organised around. Use both if you like; they answer different
      questions.
    maturity: research
    verified: 2026-09
    tags: [tool, diagnostics, quality, lerobot, overlap]
  - id: lerobot-language-schema
    name: "LeRobot language columns and recipes — a shipping annotation schema, and pi0.5's joint subtask conditioning"
    url: "https://github.com/huggingface/lerobot/blob/main/docs/source/language_and_recipes.mdx"
    type: docs
    what: >
      Two optional parquet columns beside the frames. `language_persistent` holds rows
      broadcast across every frame for state that remains active — styles `subtask`, `plan`,
      `memory`. `language_events` holds rows only on the exact frame an event was emitted —
      `interjection`, `vqa`, speech tool calls. Rows carry role/content/style/timestamp and,
      for view-dependent styles, a `camera` field that a validator enforces. A YAML recipe
      layer then turns rows into chat turns with weighted blends.
      Critically for pi0.5: `recipes/subtask_joint.yaml` supervises the assistant subtask with
      text cross-entropy on the low-level stream while action prediction stays active, which
      the docs state matches the joint setup from the pi0.5 paper, and
      `--policy.joint_subtask_conditioning=true` enables that conditioning at inference.
    why: >
      **Read this before inventing your own annotation schema.** It is the only annotation
      schema that ships inside a real dataset format, and it separates persistent from
      event language — the distinction homegrown schemas get wrong, because a sub-task label
      is state that persists across frames while an interjection is a moment.
      It is also the concrete answer to the phase-aliasing fix: this is how a per-frame
      sub-task label actually reaches a pi0.5 action expert, and it means the hierarchical
      path is available if you are on LeRobot. Note the codebase split — openpi contains no
      subtask branch at all, so on openpi the route is the instruction string.
    maturity: production
    verified: 2026-09
    tags: [annotation, schema, subtask, pi05, joint-conditioning, language]
  - id: lerobot-annotation-pipeline
    name: "LeRobot annotation pipeline — VLM auto-labelling that produces those columns"
    url: "https://github.com/huggingface/lerobot/blob/main/docs/source/annotation_pipeline.mdx"
    type: docs
    what: >
      A VLM pipeline (`lerobot-annotate`) that generates the language columns: plan/subtask,
      memory, interjection and VQA modules, a served VLM by default via vLLM, optional dispatch
      to hosted jobs, a validator, and a cost estimate. Subtasks are produced by a two-step
      describe-then-segment flow over timestamped contact sheets — frames sampled at 0.5 s with
      the time burned into each image — with an explicit causal definition of an event boundary.
    why: >
      The only end-to-end VLM auto-labelling pipeline from a major organisation, and the
      contact-sheet trick is the part worth stealing even if you build your own: segmenting a
      time-annotated strip of frames is a far easier VLM task than segmenting video, and it
      makes the model's boundary decision auditable by a human afterwards.
    maturity: production
    verified: 2026-09
    tags: [annotation, vlm, auto-labelling, subtask, pipeline]
  - id: lerobot-annotation-ui
    name: "lerobot-annotate — annotation UI"
    url: "https://github.com/huggingface/lerobot-annotate"
    type: repo
    what: "A lightweight web UI for annotating LeRobot datasets."
    why: >
      The human correction pass on top of automatic labels. Worth having because automatic
      sub-task boundaries are good enough to seed and not good enough to trust — and a
      boundary error inside a chained task is exactly the kind of label noise that teaches a
      policy the wrong phase.
    maturity: production
    verified: 2026-09
    tags: [annotation, ui, human-in-the-loop, subtask]
  - id: lerobot-good-dataset
    name: "LeRobot — what makes a good dataset"
    url: "https://huggingface.co/blog/lerobot-datasets"
    type: blog
    what: >
      The closest thing to a written collection SOP: at least two camera views, steady capture,
      stable lighting and exposure, the leader arm out of frame, only the follower and the
      objects moving, static background, at least 480x640 (720p preferred), around 30 FPS,
      `<modality>.<location>` naming, and task strings of 25-50 characters. It also enumerates
      the four failure modes seen in community datasets.
    why: >
      Use it as your collection spec rather than writing one. The "only the follower and the
      objects move, leader arm out of frame" rule is the one most often broken, and it matters
      because a leader arm in view is a second, correlated copy of the action — the policy will
      happily learn to read it.
    maturity: production
    verified: 2026-09
    tags: [collection, sop, checklist, camera, dataset-quality]
  - id: hd-space
    name: "HD-Space — staged collection for later-phase start states"
    url: "https://arxiv.org/abs/2505.17389"
    type: paper
    what: "Collects data in stages: roll out the current policy to reach later-phase start states, then collect demonstrations from there."
    why: >
      The direct answer to "all my demonstrations start from the same initial state", which is
      the data-side cause of a policy that only ever performs the first motion. It gets you
      intermediate-state initialisation without hand-resetting the scene between every episode —
      the practical obstacle that stops teams from collecting this data at all.
    maturity: research
    verified: 2026-09
    tags: [collection, intermediate-states, long-horizon, covariate-shift, recovery]
  - id: robomimic-what-matters
    name: "What Matters in Learning from Offline Human Demonstrations"
    url: "https://arxiv.org/abs/2108.03298"
    type: paper
    what: >
      The canonical study of demonstration-data quality. Two findings to carry into any dataset
      decision: the mixed-quality regime has more demonstrations than the proficient-human
      regime (300 versus 200) and still scores lower — more mixed-quality data loses to less
      good data — and the lowest-validation-loss checkpoint is between 10% and 100% worse than
      the best checkpoint. It also quantifies that dropping wrist cameras costs 10-45% relative
      success in some tasks.
    why: >
      The empirical backing for the two habits this repo keeps recommending: prefer clean
      demonstrations over volume, and never select a checkpoint by validation loss. Both are
      quantified here rather than asserted.
    maturity: research
    verified: 2026-09
    tags: [data-quality, study, checkpoint-selection, cameras, negative-result]
  - id: data-scaling-laws
    name: "Data Scaling Laws in Imitation Learning for Robotic Manipulation"
    url: "https://arxiv.org/abs/2410.18647"
    type: paper
    what: >
      Over 40,000 demonstrations and 15,000 real rollouts. Generalisation scales roughly as a
      power law in the number of environments and objects, with saturation in demonstrations
      per object. Four collectors working for one afternoon reached about 90% success in novel
      environments with unseen objects.
    why: >
      The most decision-relevant paper for spending a data budget: collect breadth, not depth.
      If you are choosing between more demonstrations in the same scene and fewer
      demonstrations across more scenes, this is the evidence that the second is worth more.
      It is also the counterweight to the reflex of extending an existing session.
    maturity: research
    verified: 2026-09
    tags: [data-scaling, diversity, collection, budget, environments]
