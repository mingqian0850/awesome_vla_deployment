  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - data-quality
  - curation
  - metrics
  - structural-defects
  - negative-result
  what: Audits action-only data-quality scores against defects such as idle frames, ambiguous state and
    spurious correlations.
  what_zh: 检查仅根据动作计算的数据质量分数能否发现空闲帧、状态歧义和伪相关等缺陷。
