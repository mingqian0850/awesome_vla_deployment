section: "Data — collection, annotation, cleaning, segmentation"
order: 20
description: >
  The paper-level curation of this area is already done well elsewhere — see
  AIDASLab's list and Awesome-Robot-Data-Engine in the Landscape section. This section
  therefore focuses on the two things those lists do not give you: the collection
  systems themselves, and the reproducible decisions (thresholds, schemas, splits).
