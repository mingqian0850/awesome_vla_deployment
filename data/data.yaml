    name: "LeRobot — imitation learning on real robots"
    url: "https://huggingface.co/docs/lerobot/en/il_robots"
    type: docs
    what: "End-to-end walkthrough: build, calibrate, teleoperate, record, train, evaluate."
    why: "Contains the operational detail (calibration procedure, teleoperation setup) that papers omit and that eats your first week."
    maturity: production
    verified: 2026-09
    tags: [docs, calibration, teleoperation]
  - id: lerobot-so101
    name: "LeRobot — SO-101 assembly and calibration"
    url: "https://huggingface.co/docs/lerobot/en/so101"
    type: docs
    what: "Bill-of-materials-level build and calibration guide for the SO-101 arm."
    why: "A worked example of the calibration discipline every learned policy depends on. The procedure generalises even if your arm is different."
    maturity: production
    verified: 2026-09
