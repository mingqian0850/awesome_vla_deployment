- id: robomimic-what-matters
  name: What Matters in Learning from Offline Human Demonstrations
  url: https://arxiv.org/abs/2108.03298
  type: paper
  maturity: research
  verified: 2026-09
  tags:
  - data-quality
  - study
  - checkpoint-selection
  - cameras
  - negative-result
  what: Studies demonstration quality, camera observations and checkpoint evaluation in offline imitation
